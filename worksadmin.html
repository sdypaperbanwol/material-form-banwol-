<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>출근 현황판</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, 'Segoe UI', '맑은 고딕', sans-serif; margin: 0; padding: 16px; background: #f7f8fa; color: #1f2937; }
  @media (prefers-color-scheme: dark) {
    body { background: #111827; color: #e5e7eb; }
    .card, .site-card { background: #1f2937 !important; border-color: #374151 !important; }
    th { background: #374151 !important; color: #e5e7eb !important; }
    td { border-color: #374151 !important; }
    .absent { background: #3a2222 !important; }
  }
  h1 { font-size: 18px; margin: 0 0 14px; }
  .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; align-items: center; }
  .filter-bar input, .filter-bar select, .filter-bar button { font-size: 14px; padding: 8px; border-radius: 8px; border: 1px solid #d1d5db; }
  .filter-bar button { background: #2563eb; color: white; border: none; cursor: pointer; }
  .filter-bar .chk { display: flex; align-items: center; gap: 4px; font-size: 13px; }
  .site-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; margin-bottom: 16px; }
  .site-card { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; text-align: center; }
  .site-name { font-size: 12px; color: #6b7280; margin-bottom: 4px; }
  .site-num { font-size: 20px; }
  .card { background: white; border: 1px solid #e5e7eb; border-radius: 10px; padding: 12px; margin-bottom: 16px; overflow-x: auto; }
  .card h2 { font-size: 14px; margin: 0 0 10px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { padding: 6px 8px; border-bottom: 1px solid #e5e7eb; text-align: left; white-space: nowrap; }
  th { background: #f3f4f6; }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  .absent { background: #fef2f2; }
  .empty { text-align: center; color: #9ca3af; }
  .err { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 10px; border-radius: 8px; margin-bottom: 14px; font-size: 13px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tabs button { font-size: 13px; padding: 6px 12px; border-radius: 8px; border: none; background: #f3f4f6; color: #374151; cursor: pointer; }
  .tabs button.on { background: #2563eb; color: white; }
  .loading { text-align: center; padding: 40px; color: #6b7280; font-size: 14px; }
</style>
</head>
<body>

  <h1>출근 현황판</h1>
  <div id="errorBox" class="err" style="display:none;"></div>

  <div class="filter-bar">
    <input type="date" id="dateInput" onchange="loadData()">
<select id="siteSelect" onchange="renderUI()">
      <option value="전체">전체 사업장</option>
      <option value="반월" selected>반월</option>
      <option value="시화">시화</option>
      <option value="대양">대양</option>
    </select>
    <label class="chk"><input type="checkbox" id="onlyCheck" checked onchange="renderUI()"> 현재 출근자만(근무중)</label>
    <button onclick="loadData()">새로고침</button>
  </div>

  <div id="loadingBox" class="loading">데이터를 불러오는 중입니다...</div>

  <div id="mainSection" style="display:none;">
    <div class="site-grid" id="siteCards"></div>

    <div class="card">
      <div class="tabs">
        <button id="tabPart" class="on" onclick="switchView('part')">파트별</button>
        <button id="tabShift" onclick="switchView('shift')">조별</button>
      </div>
      <table><tbody id="bucketTable"></tbody></table>
    </div>

    <div class="card">
      <h2>출근 명단</h2>
      <table>
        <thead><tr><th>이름</th><th>사번</th><th>파트</th><th>조</th><th>출근</th><th>퇴근</th></tr></thead>
        <tbody id="rowsTable"><tr class="empty"><td colspan="6">데이터 없음</td></tr></tbody>
      </table>
    </div>

    <div class="card">
      <h2>출퇴근 변경 요청</h2>
      <table>
        <thead><tr><th>이름</th><th>사번</th><th>날짜</th><th>내용</th><th>상태</th></tr></thead>
        <tbody id="requestsTable"><tr class="empty"><td colspan="5">요청 없음</td></tr></tbody>
      </table>
    </div>
  </div>

<script>
  // 👉 구글 앱스 스크립트 웹 앱 URL 입력
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbx_4iVPueNcl4vesXrnPPdD3wnrw_0HYtKnzTcVY5YQPTPfYvkija7RgSSiMAx9Ouv1/exec';

  const TARGET_PARTS = ["초지파트", "원질파트", "공무파트", "소각파트", "환경파트", "전기파트"];
  const SHIFT_TEAMS = ["A", "B", "C", "D"];
  const SITES = ["반월", "시화", "대양"];

  let rawData = null;
  let currentView = 'part';

window.onload = function() {
    document.getElementById('dateInput').value = new Date().toISOString().slice(0, 10);
    // 기본값 명시적 지정 (반월, 체크박스 켜기)
    document.getElementById('siteSelect').value = '반월';
    document.getElementById('onlyCheck').checked = true;
    loadData();
  };

  async function loadData() {
    const workDate = document.getElementById('dateInput').value;
    document.getElementById('loadingBox').style.display = 'block';
    document.getElementById('mainSection').style.display = 'none';
    document.getElementById('errorBox').style.display = 'none';

    try {
      const resp = await fetch(`${GAS_URL}?date=${workDate}`);
      const json = await resp.json();

      if (!json.success) {
        throw new Error(json.error || '데이터를 가져오지 못했습니다.');
      }

      rawData = json.data;
      document.getElementById('loadingBox').style.display = 'none';
      document.getElementById('mainSection').style.display = 'block';
      renderUI();

    } catch (err) {
      document.getElementById('loadingBox').style.display = 'none';
      const errBox = document.getElementById('errorBox');
      errBox.innerText = err.message;
      errBox.style.display = 'block';
    }
  }

  function switchView(mode) {
    currentView = mode;
    document.getElementById('tabPart').className = mode === 'part' ? 'on' : '';
    document.getElementById('tabShift').className = mode === 'shift' ? 'on' : '';
    renderUI();
  }

  function renderUI() {
    if (!rawData) return;
    const siteFilter = document.getElementById('siteSelect').value;
    const onlyPresent = document.getElementById('onlyCheck').checked;

    // 1. 사이트별 카드
    let siteCardsHtml = '';
    SITES.forEach(s => {
      const c = rawData.att.siteCounts[s] || { total: 0, working: 0 };
      siteCardsHtml += `
        <div class="site-card">
          <div class="site-name">${s}</div>
          <div class="site-num"><b>${c.working}</b> / ${c.total}</div>
        </div>`;
    });
    document.getElementById('siteCards').innerHTML = siteCardsHtml;

    // 2. 파트별/조별 테이블
    let bucketHtml = '';
    if (currentView === 'part') {
      const keys = TARGET_PARTS.concat(['기타']).filter(k => rawData.att.partCounts[k]);
      bucketHtml = keys.map(k => {
        const c = rawData.att.partCounts[k];
        return `<tr><td>${k}</td><td class="num">${c.working} / ${c.total}</td></tr>`;
      }).join('');
    } else {
      const keys = SHIFT_TEAMS.concat(['기타']).filter(k => rawData.att.shiftCounts[k]);
      bucketHtml = keys.map(k => {
        const c = rawData.att.shiftCounts[k];
        return `<tr><td>${k}조</td><td class="num">${c.working} / ${c.total}</td></tr>`;
      }).join('');
    }
    document.getElementById('bucketTable').innerHTML = bucketHtml || '<tr><td class="empty">데이터 없음</td></tr>';

    // 3. 출근 명단 필터링 및 정렬
    let rows = (siteFilter === '전체' ? SITES : [siteFilter]).reduce((acc, s) => acc.concat(rawData.att.rowsBySite[s] || []), []);
    if (onlyPresent) {
      rows = rows.filter(r => r.checkIn !== '-' && r.checkOut === '-');
    }

    // 지정한 파트 순서 정의
    const PART_ORDER = ["초지파트", "원질파트", "공무파트", "소각파트", "환경파트", "전기파트", "기타"];

    // 파트 순서에 맞게 정렬 (파트가 같으면 이름순)
    rows.sort((a, b) => {
      let idxA = PART_ORDER.indexOf(a.part);
      let idxB = PART_ORDER.indexOf(b.part);
      if (idxA === -1) idxA = 99;
      if (idxB === -1) idxB = 99;
      if (idxA !== idxB) return idxA - idxB;
      return a.name.localeCompare(b.name);
    });

    // 파트별로 구분선(헤더)을 넣어가며 HTML 생성
    let rowsHtml = '';
    let lastPart = null;

    rows.forEach(r => {
      if (r.part !== lastPart) {
        lastPart = r.part;
        rowsHtml += `
          <tr style="background: rgba(37, 99, 235, 0.08); font-weight: bold;">
            <td colspan="6" style="border-top: 2px solid #2563eb; color: #2563eb; padding: 8px;">📍 ${lastPart}</td>
          </tr>`;
      }
      rowsHtml += `
        <tr class="${r.checkedIn ? '' : 'absent'}">
          <td>${r.name}</td><td>${r.empNo}</td><td>${r.part}</td><td>${r.shift}조</td><td>${r.checkIn}</td><td>${r.checkOut}</td>
        </tr>`;
    });

    document.getElementById('rowsTable').innerHTML = rowsHtml || '<tr><td colspan="6" class="empty">명단 없음</td></tr>';

    // 4. 요청 목록
    let reqHtml = rawData.requests.length ? rawData.requests.map(r => `
      <tr>
        <td>${r.employee_name || r.name || '-'}</td>
        <td>${r.emp_no || '-'}</td>
        <td>${r.work_date || '-'}</td>
        <td>${r.content || r.reason || '-'}</td>
        <td>${r.status || r.state || '-'}</td>
      </tr>`).join('') : '<tr><td colspan="5" class="empty">요청 없음</td></tr>';
    document.getElementById('requestsTable').innerHTML = reqHtml;
  }
</script>
</body>
</html>
