<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>반월공장 3D 통합 배치도 (지도 + 창고 재고 + 원료 야적)</title>
<style>
:root{
  --bg:#eceff3; --panel:#fbfbfc; --text:#1b2330; --muted:#677286; --line:#d3d9e2;
  --accent:#1d4ed8; --scene-bg:#dfe4eb; --ground:#f4f5f7; --edge:#1b2330; --chip:#e6eaf0;
  --label-bg:rgba(251,251,252,.92); --label-text:#1b2330;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d121b; --panel:#151c28; --text:#e4e9f1; --muted:#8d9ab0; --line:#27313f;
    --accent:#6ea0ff; --scene-bg:#0f1520; --ground:#1a2230; --edge:#c9d3e3; --chip:#222c3b;
    --label-bg:rgba(21,28,40,.92); --label-text:#e4e9f1;
  }
}
:root[data-theme="dark"]{
  --bg:#0d121b; --panel:#151c28; --text:#e4e9f1; --muted:#8d9ab0; --line:#27313f;
  --accent:#6ea0ff; --scene-bg:#0f1520; --ground:#1a2230; --edge:#c9d3e3; --chip:#222c3b;
  --label-bg:rgba(21,28,40,.92); --label-text:#e4e9f1;
}
html,body{height:100%;margin:0}
body{
  background:var(--bg); color:var(--text);
  font-family:"Pretendard","Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;
  font-size:14px; line-height:1.5; overflow:hidden;
}
#app{display:grid;grid-template-columns:1fr 310px;height:100%}
#stage{position:relative;min-height:0;min-width:0;overflow:hidden;background:var(--scene-bg)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{
  position:absolute;transform:translate(-50%,-100%);white-space:nowrap;
  background:var(--label-bg);color:var(--label-text);
  padding:1px 7px;border-radius:3px;font-size:12px;border:1px solid var(--line);
}
.lbl.on{border-color:var(--accent);font-weight:600}
.toolbar{position:absolute;top:12px;left:12px;display:flex;gap:6px;flex-wrap:wrap}
button{font:inherit;color:inherit;cursor:pointer}
.tb{
  background:var(--panel);border:1px solid var(--line);border-radius:5px;
  padding:5px 11px;
}
.tb:hover{border-color:var(--accent)}
.tb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
button:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.legend{
  position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:8px 11px;display:flex;flex-wrap:wrap;gap:4px 14px;max-width:min(560px,calc(100% - 24px));
  font-size:12px;color:var(--muted)
}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.hint{position:absolute;right:12px;bottom:12px;font-size:12px;color:var(--muted);text-align:right}
#panel{
  background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;
  min-height:0;min-width:0
}
.head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.head h1{font-size:16px;margin:0 0 2px;font-weight:700}
.head p{margin:0;color:var(--muted);font-size:12px}
#info{padding:12px 16px;border-bottom:1px solid var(--line);min-height:150px}
#info .empty{color:var(--muted)}
#info h2{margin:0 0 8px;font-size:15px}
dl{display:grid;grid-template-columns:72px 1fr;gap:3px 8px;margin:0 0 10px}
dt{color:var(--muted)} dd{margin:0}
.seg{display:flex;gap:4px;margin-bottom:8px}
.seg button{
  flex:1;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:4px 0
}
.seg button[aria-pressed="true"]{color:#fff;border-color:transparent}
.seg button[data-s="ok"][aria-pressed="true"]{background:#2e9e5b}
.seg button[data-s="warn"][aria-pressed="true"]{background:#d98a06}
.seg button[data-s="check"][aria-pressed="true"]{background:#d63c3c}
textarea{
  width:100%;box-sizing:border-box;resize:vertical;min-height:54px;background:var(--bg);
  color:var(--text);border:1px solid var(--line);border-radius:5px;padding:6px 8px;font:inherit
}
#list{flex:1;overflow:auto;padding:6px 8px 12px;min-height:0}
#list button{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;
  padding:4px 8px;border-radius:4px
}
#list button:hover{background:var(--chip)}
#list button[aria-current="true"]{background:var(--chip);font-weight:600}
#list .st{margin-left:auto}
.note{padding:8px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}

.modlabels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.modtip{position:absolute;display:none;pointer-events:none;background:var(--panel);color:var(--text);border:1px solid var(--accent);border-radius:5px;padding:3px 9px;font-size:12px;white-space:nowrap;z-index:6}
#app.nopanel{grid-template-columns:1fr 0}
#app.nopanel #panel{display:none}
.toolbar{gap:4px}
.tb{border-radius:4px;padding:4px 11px;font-size:13px}
.ptabs button{border-radius:4px;font-size:13px}
.note summary{cursor:pointer;color:var(--muted);user-select:none}
.note details,details.note{padding:8px 16px}
.note > div,details.note > div{margin-top:6px;line-height:1.55}
.ptabs{display:flex;gap:4px;padding:8px 10px;border-bottom:1px solid var(--line)}
.ptabs button{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:4px 0}
.ptabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.ptab{flex:1;min-height:0;display:flex;flex-direction:column;overflow:auto}
.ptab[hidden]{display:none}
.modbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line)}
.modbar .tb{padding:3px 9px;font-size:12px}
.ptab .legend{position:static;margin:8px 12px;max-width:none}
.ptab .head{border-bottom:1px solid var(--line)}
.mod-wh .lbl{
  position:absolute;transform:translate(-50%,-100%);white-space:nowrap;
  background:var(--label-bg);color:var(--label-text);
  padding:0 6px;border-radius:3px;font-size:11.5px;border:1px solid var(--line);
}
.mod-wh .lbl.sec{font-weight:700;font-size:12px}
.mod-wh .dline{position:absolute;height:1px;background:var(--accent);opacity:.35;transform-origin:0 0;pointer-events:none}
.mod-wh button, .mod-wh select{font:inherit;color:inherit}
.mod-wh button{cursor:pointer}
.mod-wh .tb{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 11px}
.mod-wh .tb:hover{border-color:var(--accent)}
.mod-wh .tb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.mod-wh button:focus-visible, .mod-wh select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mod-wh .legend{
  position:absolute;left:12px;bottom:12px;background:var(--panel);border:1px solid var(--line);
  border-radius:6px;padding:8px 11px;font-size:12px;color:var(--muted);min-width:230px
}
.mod-wh .bar{height:10px;border-radius:3px;margin:4px 0 2px}
.mod-wh .scale{display:flex;justify-content:space-between}
.mod-wh .head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.mod-wh .head h1{font-size:16px;margin:0 0 2px;font-weight:700}
.mod-wh .head p{margin:0;color:var(--muted);font-size:12px}
.mod-wh .ctrl{padding:10px 16px;border-bottom:1px solid var(--line);display:grid;grid-template-columns:64px 1fr;gap:6px 8px;align-items:center}
.mod-wh .ctrl label{color:var(--muted)}
.mod-wh .seg{display:flex;gap:4px}
.mod-wh .seg button{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:3px 0}
.mod-wh .seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.mod-wh select{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:4px 6px}
.mod-wh #wh-info{padding:12px 16px;border-bottom:1px solid var(--line);min-height:170px}
.mod-wh #wh-info .empty{color:var(--muted)}
.mod-wh #wh-info h2{margin:0 0 8px;font-size:15px}
.mod-wh dl{display:grid;grid-template-columns:76px 1fr;gap:3px 8px;margin:0 0 10px}
.mod-wh dt{color:var(--muted)}
.mod-wh dd{margin:0}
.mod-wh .acts{display:flex;gap:6px}
.mod-wh .acts button{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:4px 0}
.mod-wh .acts button:hover{border-color:var(--accent)}
.mod-wh .acts button:disabled{opacity:.4;cursor:default}
.mod-wh .small{font-size:12px;color:var(--muted);margin-top:8px}
.mod-wh #wh-sum{flex:1;overflow:auto;padding:0 10px 8px;min-height:0}
.mod-wh #wh-sum .tot{padding:2px 6px 8px;color:var(--muted)}
.mod-wh #wh-sum .tot:first-child{padding-top:8px}
.mod-wh #wh-sum button{
  display:block;width:100%;text-align:left;background:none;border:1px solid transparent;
  border-radius:5px;padding:6px 8px;margin-bottom:2px
}
.mod-wh #wh-sum button:hover{background:var(--chip)}
.mod-wh #wh-sum b{font-weight:600}
.mod-wh #wh-sum .sub{color:var(--muted);font-size:12px}
.mod-wh .note{padding:8px 16px;font-size:11px;color:var(--muted);border-top:1px solid var(--line)}
.mod-wh .tabs{display:flex;gap:4px;padding:8px 10px 0}
.mod-wh .tabs button{flex:1;background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:3px 0}
.mod-wh .tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.mod-wh table.tbl{width:100%;border-collapse:separate;border-spacing:0;font-size:12.5px}
.mod-wh .tbl th, .mod-wh .tbl td{padding:3px 6px;text-align:right;border-bottom:1px solid var(--line)}
.mod-wh .tbl th:first-child, .mod-wh .tbl td:first-child{text-align:left}
.mod-wh .tbl td.loc, .mod-wh .tbl th:last-child{text-align:left}
.mod-wh .tbl td.loc{color:var(--muted);font-size:11.5px}
.mod-wh .tbl th{position:sticky;top:0;z-index:2;background:var(--panel);color:var(--muted);font-weight:500;white-space:nowrap}
.mod-wh .tbl tr.sum td{font-weight:600;border-top:1px solid var(--line)}
.mod-wh .tbl tr.none td{color:var(--muted);opacity:.55}
.mod-wh .dot2{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;background:var(--muted);vertical-align:baseline}
.mod-wh .meter{height:5px;background:var(--chip);border-radius:3px;margin-top:5px;overflow:hidden}
.mod-wh .meter i{display:block;height:100%;background:var(--accent)}
.mod-wh .tbl tr.row{cursor:pointer}
.mod-wh .tbl tr.row:hover, .mod-wh .tbl tr.on{background:var(--chip)}
.mod-wh #wh-sum .clr{margin:0 0 6px;padding:3px 8px;border:1px solid var(--line);border-radius:5px;background:var(--chip);display:inline-block;width:auto}
.mod-yd .lbl{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;background:var(--label-bg);color:var(--label-text);padding:0 6px;border-radius:3px;font-size:11.5px;border:1px solid var(--line)}
.mod-yd .lbl.sec{font-weight:700;font-size:12px}
.mod-yd button, .mod-yd input{font:inherit;color:inherit}
.mod-yd button{cursor:pointer}
.mod-yd .tb{background:var(--panel);border:1px solid var(--line);border-radius:5px;padding:5px 11px}
.mod-yd .tb:hover{border-color:var(--accent)}
.mod-yd .tb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.mod-yd button:focus-visible, .mod-yd input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mod-yd .head{padding:14px 16px 10px;border-bottom:1px solid var(--line)}
.mod-yd .head h1{font-size:16px;margin:0 0 2px;font-weight:700}
.mod-yd .head p{margin:0;color:var(--muted);font-size:12px}
.mod-yd .card{padding:12px 16px;border-bottom:1px solid var(--line)}
.mod-yd .card h2{margin:0 0 6px;font-size:14px}
.mod-yd .row{display:flex;justify-content:space-between;gap:8px}
.mod-yd .meter{height:7px;background:var(--chip);border-radius:4px;margin:6px 0;overflow:hidden}
.mod-yd .meter i{display:block;height:100%;background:var(--accent)}
.mod-yd .small{font-size:12px;color:var(--muted)}
.mod-yd .inp{display:flex;gap:6px;margin-top:8px}
.mod-yd .inp input{flex:1;min-width:0;background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:3px 6px}
.mod-yd .inp button{background:var(--chip);border:1px solid var(--line);border-radius:5px;padding:3px 9px}
.mod-yd .inp button:hover{border-color:var(--accent)}
.mod-yd dl{display:grid;grid-template-columns:84px 1fr;gap:3px 8px;margin:0}
.mod-yd dt{color:var(--muted)}
.mod-yd dd{margin:0}
.mod-yd .note{padding:10px 16px;font-size:11px;color:var(--muted)}
@media (max-width:760px){
  #app{grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) 46vh}
  #panel{border-left:0;border-top:1px solid var(--line)}
  .hint{display:none}
}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <canvas id="c"></canvas>
    <div id="labels"></div>
    <div class="modlabels mod-wh" id="wh-labels"></div>
    <div class="modlabels mod-yd" id="yd-labels"></div>
    <div class="toolbar">
      <button class="tb" id="bReset">기본 시점</button>
      <button class="tb" id="bTop">평면</button>
      <button class="tb" id="bFlyWh">창고</button>
      <button class="tb" id="bFlyYd">원료</button>
      <button class="tb" id="bLabels" aria-pressed="false">이름</button>
      <button class="tb" id="bPanel" aria-pressed="true">패널</button>
    </div>
    <div class="legend" id="legend"></div>
    <div class="hint">왼쪽 드래그: 회전 · 오른쪽 드래그: 이동 · 휠: 확대</div>
  </div>
  <aside id="panel">
  <div class="ptabs" id="ptabs"><button data-pt="map" aria-pressed="true">지도</button><button data-pt="wh" aria-pressed="false">창고</button><button data-pt="yd" aria-pressed="false">원료</button></div>
  <div class="ptab" data-pt="map">
    <div class="head">
      <h1>반월공장 3D 통합 배치도</h1>
      <p>1층 평면도 기준의 단순 모형 · 빌드 10 (10/08 09:29)</p>
    </div>
    <div id="info"></div>
    <div id="list"></div>
    <details class="note"><summary>안내</summary><div>높이와 상태값은 임의의 샘플입니다. 상태·메모는 이 브라우저에만 저장됩니다.</div></details>
  </div>
  <div class="ptab mod-wh" data-pt="wh" id="pane-wh" data-ids="bDemo,bLabels,bPanel,bRefresh,bRoof,bSim,info,legend,modeSeg,note,statDot,statTxt,sum,tabs,tf,wf" hidden><div class="modbar"><button class="tb" id="wh-bRoof" aria-pressed="true">지붕</button><button class="tb" id="wh-bSim" aria-pressed="true">동작 애니메이션</button><button class="tb" id="wh-bDemo">동작 시연</button><button class="tb" id="wh-bLabels" aria-pressed="true">이름</button><button class="tb" id="wh-bRefresh">재고 새로고침</button></div><div class="legend" id="wh-legend"></div>
    <div class="head">
      <h1>창고</h1>
      <p><span class="dot2" id="wh-statDot"></span><span id="wh-statTxt">불러오는 중…</span></p>
    </div>
    <div class="ctrl">
      <label>색상</label>
      <div class="seg" id="wh-modeSeg">
        <button data-m="width" aria-pressed="true">지폭별</button>
        <button data-m="fill" aria-pressed="false">적재율</button>
        <button data-m="type" aria-pressed="false">지종별</button>
      </div>
      <label for="wh-wf">지폭 필터</label>
      <select id="wh-wf"></select>
      <label for="wh-tf">지종 필터</label>
      <select id="wh-tf"></select>
    </div>
    <div id="wh-info"></div>
    <div class="tabs" id="wh-tabs"><button data-tab="zone" aria-pressed="true">구역</button><button data-tab="stock" aria-pressed="false">재고표</button></div>
    <div id="wh-sum"></div>
    <details class="note"><summary>안내</summary><div id="wh-note"></div></details>
  </div>
  <div class="ptab mod-yd" data-pt="yd" id="pane-yd" data-ids="bAnim,bLabels,bPanel,bTruck,info,legend,note,tanks,today,veh,zones" hidden><div class="modbar"><button class="tb" id="yd-bAnim" aria-pressed="true">동작</button><button class="tb" id="yd-bTruck" aria-pressed="false">시연 자동 입차</button><button class="tb" id="yd-bLabels" aria-pressed="true">이름</button></div>
    <div class="head">
      <h1>원료 · 원형조 1~4</h1>
      <p>계근대 목록 연동 · 구역 톤수는 직접 입력</p>
    </div>
    <div id="yd-zones"></div>
    <div class="card" id="yd-veh"></div>
    <div class="card" id="yd-today"></div>
    <div class="card" id="yd-tanks"></div>
    <div class="card" id="yd-info"><div class="small">구역, 원형조, 차량, 페이로더를 클릭하면 정보가 표시됩니다.</div></div>
    <details class="note"><summary>안내</summary><div id="yd-note"></div></details>
  </div>
</aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="text/plain" id="code-wh">(function(){
  'use strict';

  /* ---------- 상수 ---------- */
  var OX = -34.3115, OZ = 6.7645;          // 창고 좌표(m) → 장면 중심 보정
  var P = 1.15, R = 0.55;        // 롤 배치 간격 / 반경 (지름 1.1m 가정)
  var MAXH = 6.3;                // 최대 적재 높이 (2100mm × 3단)
  var FLOOR = 0.2;               // 바닥 슬래브 두께
  function maxTiers(w){ return Math.max(1, Math.floor(MAXH*1000/w + 1e-9)); }

  /* ---------- 재고 데이터 ----------
     시트 "재고현황" 중 창고코드 9160 행을 아래 형식으로 넣으면 실제 재고로 표시됩니다.
     {code:'9160', type:'S', gsm:120, width:1600, kg:28034, rolls:22}
     (A~J열: 공장, 창고코드, 창고명, 품목코드, 품목명, 지종, 평량, 지폭, 중량, 롤 수 로 해석)  */
  var STOCK_ROWS = null;
  var DATA_LABEL = '샘플 데이터';

  /* ---------- 구역 정의 (창고 좌표: x=동쪽, z=남쪽, 원점=본관 북서 모서리) ----------
     axis 'x': 라인이 동서 방향, 칸이 남북 방향 / axis 'z': 라인이 남북 방향(세로), 칸이 동서 방향 */
  var SECT = [
    {id:'A',   short:'A',     name:'A구역 · 중폭',            axis:'x', lines:8,  cols:5, x0:1.0,   z0:1.0},
    {id:'B',   short:'B',     name:'B구역 · 입구쪽',          axis:'x', lines:11, cols:6, x0:1.0,   z0:26.8},
    {id:'CU',  short:'C위',   name:'C구역 위 · 안쪽 · 단폭',  axis:'x', lines:16, cols:5, x0:17.3,  z0:1.0},
    {id:'CD1', short:'C확장①', name:'C구역 확장부 ① · 장폭',  axis:'z', lines:16, cols:5, x0:29.0,  z0:27.0},
    {id:'CD2', short:'C확장②', name:'C구역 확장부 ② · 장폭',  axis:'z', lines:16, cols:5, x0:19.45, z0:27.0}

  var stockList = [], stockByKey = {}, unplaced = [], wLo = 950, wHi = 2500, typeList = [], liveLoaded = false, packedNote = '';

  function buildStock(rows){
    var map = {};
    rows.forEach(function(r){
      if(r.code !== undefined && String(r.code) !== '9160') return;
      var w = num(r.width), n = num(r.rolls);
      if(!w || !n || n < 0) return;
      var type = String(r.type == null ? '' : r.type).trim() || '-';
      var gsm = num(r.gsm);
      var key = type + '|' + gsm + '|' + w;
      var o = map[key] || (map[key] = {key:key, type:type, gsm:gsm, w:w, rolls:0, kg:0});
      o.rolls += n; o.kg += num(r.kg);
    });
    stockByKey = map;
    return Object.keys(map).map(function(k){ return map[k]; }).sort(function(a,b){
      return a.w - b.w || (a.type < b.type ? -1 : a.type > b.type ? 1 : 0) || a.gsm - b.gsm;
    });
  }

  function sampleRows(){
    var seed = 20261006;
    function rnd(){
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      var t = Math.imul(seed ^ seed >>> 15, 1 | seed);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    }
    var rows = [];
    for(var w=950; w<=2500; w+=50){
      var n = w <= 1500 ? 8 + Math.floor(rnd()*30) : (w <= 1600 ? 30 + Math.floor(rnd()*40) : 5 + Math.floor(rnd()*16));
      var ns = Math.ceil(n*0.6);
      rows.push({code:'9160', type:'S', gsm:120, width:w, rolls:ns});
      if(n - ns > 0) rows.push({code:'9160', type:'K', gsm:150, width:w, rolls:n - ns});
    }
    return rows;
  }

  function putStack(sl, o, t){ sl.w = o.w; sl.max = maxTiers(o.w); sl.key = o.key; sl.type = o.type; sl.gsm = o.gsm; sl.t = t; }
  function stacksByWidth(items){
    var byW = {};
    items.forEach(function(o){
      var mx = maxTiers(o.w), n = o.rolls, arr = byW[o.w] || (byW[o.w] = []);
      while(n > 0){ var t = Math.min(mx, n); arr.push({o:o, t:t}); n -= t; }
    });
    return byW;
  }
  // 한 줄에는 한 지폭만: 지폭이 바뀌면 다음 줄에서 시작. 줄이 부족하면 false.
  function allocByLines(g, items){
    var secs = g.sects.map(sect), cols = secs[0].cols;
    var byW = stacksByWidth(items);
    var ws = Object.keys(byW).map(Number).sort(function(a,b){ return a-b; });
    var need = ws.reduce(function(a,w){ return a + Math.ceil(byW[w].length/cols); }, 0);
    var avail = secs.reduce(function(a,q){ return a + q.lines; }, 0);
    if(need > avail) return false;
    var lineRefs = [];
    if(secs.length > 1){

      secs.forEach(function(q){ for(var i=0;i<Math.min(q2,q.lines);i++) lineRefs.push({s:q,i:i}); });
    } else {
      for(var i0=0;i0<secs[0].lines;i0++) lineRefs.push({s:secs[0],i:i0});
    }
    var p = 0;
    ws.forEach(function(w){
      var st = byW[w];
      for(var k=0;k<st.length;k+=cols){
        var ln = lineRefs[p++];
        for(var c=0;c<cols && k+c<st.length;c++) putStack(ln.s.slots[ln.i*cols + c], st[k+c].o, st[k+c].t);

    var perSect = g.sects.map(function(id){

      for(var i=0;i<q.lines;i++){ for(var j=0;j<q.cols;j++) arr.push(q.slots[i*q.cols + j]); }
      return arr;
    });

    if(perSect.length > 1){
      var need = items.reduce(function(a,o){ return a + Math.ceil(o.rolls/maxTiers(o.w)); }, 0);
      var quota = Math.ceil(need / perSect.length);
      cells = [];
      perSect.forEach(function(arr){ cells = cells.concat(arr.slice(0, quota)); });
      if(cells.length < need) cells = [].concat.apply([], perSect);
    }
    var ptr = 0;
    items.forEach(function(o){
      var mx = maxTiers(o.w), remain = o.rolls;
      while(remain > 0){
        var sl = cells[ptr++];
        if(!sl){ unplaced.push({w:o.w, rolls:remain}); break; }

  function allocHybrid(g, items){
    var secs = g.sects.map(sect), cols = secs[0].cols;
    var byW = stacksByWidth(items);
    var ws = Object.keys(byW).map(Number).sort(function(a,b){ return a-b; });
    var lines = [];
    secs.forEach(function(q){
      for(var i=0;i<q.lines;i++){ var cl = []; for(var j=0;j<q.cols;j++) cl.push(q.slots[i*q.cols + j]); lines.push(cl); }
    });
    var cells = []; lines.forEach(function(cl){ cells = cells.concat(cl); });
    var ptr = 0;
    ws.forEach(function(w, wi){
      var remainW = ws.length - wi, lineIdx = Math.floor(ptr/cols);
      if(ptr % cols !== 0 && (lines.length - (lineIdx + 1)) >= remainW) ptr = (lineIdx + 1) * cols;
      byW[w].forEach(function(stk){
        var sl = cells[ptr++];
        if(!sl){ unplaced.push({w:w, rolls:stk.t}); return; }
        putStack(sl, stk.o, stk.t);
      });
    });

    lines.forEach(function(cl){

      var first = Math.round(o.rolls * OVERLAP_SHARE), rest = o.rolls - first;
      if(first > 0) plan[GROUPS.indexOf(gs[0])].push(item(o, first));

        var wp = s.path[s.pi];
        if(drive(f, wp.x, wp.z, dt, wp.h)){
          s.pi++;
          if(s.pi >= s.path.length){ s.u = 0; s.state = 'raise'; }
        }
        break;
      case 'raise':
        s.u += dt/1.3;
        var baseH = (j.vis ? 0 : j.idx)*j.w/1000, topY = baseH + 0.35 + r.len/2;
        r.root.position.y = (0.6 + r.len/2) + (topY - (0.6 + r.len/2)) * ease(s.u);
        setLift(f, r.root.position.y);
        if(s.u >= 1){
          var cp = clampWorld(f), wy = FLOOR + r.root.position.y;
          f.group.remove(r.root); hall.add(r.root);
          r.root.rotation.set(0,0,0); r.tilt.rotation.x = 0;
          r.root.position.set(cp.x, wy, cp.z);
          var tc = j.vis || j.cell; s.cp = cp; s.d = Math.hypot(tc.x - cp.x, tc.z - cp.z); s.u = 0;
          s.state = s.d > 0.2 ? 'xfer' : 'place';
        }
        break;
      case 'xfer':      // 안쪽 칸이면 롤이 가장자리에서 해당 칸 위로 건너감
        s.u += dt / Math.max(0.7, s.d/3);
        var e1 = ease(Math.min(1, s.u));
        var tc2 = j.vis || j.cell;
        r.root.position.x = s.cp.x + (tc2.x - s.cp.x) * e1;
        r.root.position.z = s.cp.z + (tc2.z - s.cp.z) * e1;
        setArms(f, f.armX + (0.95 - f.armX) * Math.min(1, 4*dt));
        if(s.u >= 1){ s.u = 0; s.state = 'place'; }
        break;
      case 'place':
        s.u += dt/0.9;
        var bh = (j.vis ? 0 : j.idx)*j.w/1000, ty = bh + 0.35 + r.len/2, sy = bh + r.len/2 + 0.02;
        r.root.position.y = FLOOR + ty + (sy - ty) * ease(Math.min(1, s.u));
        setArms(f, f.armX + (0.95 - f.armX) * Math.min(1, 4*dt));
        if(s.u >= 1){
          if(j.hide){ hideTop(j.cell, j.idx, false); s.wait = 0.4; }          // 실제 입고: 숨겨둔 롤이 그 자리에 나타남
          else { r.mat.emissive.setHex(0x2a7a3a); s.wait = 3.2; }              // 시연: 잠시 강조 후 사라짐
          s.state = 'placed';
        }
        break;
      case 'placed':
        s.wait -= dt;
        if(s.wait <= 0){
          hall.remove(r.root); s.roll = null;
          s.back = backRoute(s.path, HOMES.F3); s.bi = 0;
          s.state = 'back';
        }
        break;
      case 'back':
        if(f.lift > 0.92){
          setLift(f, Math.max(0.9, f.lift - 3.0*dt));
          setArms(f, f.armX + (0.85 - f.armX) * Math.min(1, 4*dt));
          break;
        }
        if(Math.abs(f.armX - 0.85) > 0.02){ setArms(f, f.armX + (0.85 - f.armX) * Math.min(1, 6*dt)); break; }
        var bw = s.back[s.bi];
        if((bw.rev ? driveBack(f, bw.x, bw.z, dt) : drive(f, bw.x, bw.z, dt, bw.h))){ s.bi++; if(s.bi >= s.back.length){ s.state = 'idle'; } }
        break;
    }
  }

  // 상차: 지게차 1·2 → 더미에서 롤 꺼냄 → 화물차에 싣기
  function stepOut(dt){
    var s = simB, r = s.roll, j = s.job, f = s.f;
    switch(s.state){
      case 'idle':
        if(!jobsOut.length) break;
        if(simA.state !== 'idle') break;                   // 입고 작업 중이면 끝날 때까지 기다림
        var ji = -1;
        for(var qi=0; qi<jobsOut.length; qi++){ if(TR[jobsOut[qi].truck].state === 'parked'){ ji = qi; break; } }
        if(ji < 0) break;                                  // 화물차가 아직 도착하지 않음
        var ff = FL[TRUCKS[jobsOut[ji].truck].fl];
        if(!atHome(ff)){ wantHome[ff.id] = true; break; }  // 대기 위치에 먼저 돌아온 뒤 시작
        wantHome[ff.id] = false;
        j = s.job = jobsOut.splice(ji, 1)[0];
        f = s.f = ff;
        j.acc = accessFor(j.cell);
        s.path = routeTo(f.id, j.acc); s.pi = 0;
        if(j.demo) hideTop(j.cell, j.idx, true);
        s.state = 'toStand';
        break;
      case 'toStand':
        setArms(f, f.armX + clamp(0.95 - f.armX, -1.5*dt, 1.5*dt));
        var wp = s.path[s.pi];
        if(drive(f, wp.x, wp.z, dt, wp.h)){
          s.pi++;
          if(s.pi >= s.path.length){
            r = s.roll = makeRoll(j.w, j.type);
            r.tilt.rotation.x = 0;
            r.root.position.set(j.cell.x, FLOOR + j.idx*j.w/1000 + j.w/2000, j.cell.z);
            hall.add(r.root);
            simLblB.el.textContent = '상차 ' + itemLabel(j) + ' · ' + j.w + 'mm';
            s.u = 0; s.y0 = f.lift; s.state = 'riseOut';
          }
        }
        break;
      case 'riseOut':   // 마스트를 롤 높이까지 올림
        s.u += dt/1.0;
        var tyl = j.idx*j.w/1000 + j.w/2000;
        setLift(f, s.y0 + (tyl - s.y0) * ease(Math.min(1, s.u)));
        if(s.u >= 1){ s.u = 0; s.state = 'xferOut'; }
        break;
      case 'xferOut':   // 더미 위의 롤이 지게차 클램프 앞으로 이동
        var cp = clampWorld(f);
        if(Math.hypot(j.cell.x - cp.x, j.cell.z - cp.z) < 0.25){ s.u = 1; }
        s.u += dt / Math.max(0.7, Math.hypot(j.cell.x - cp.x, j.cell.z - cp.z)/3);
        var e2 = ease(Math.min(1, s.u));
        r.root.position.x = j.cell.x + (cp.x - j.cell.x) * e2;
        r.root.position.z = j.cell.z + (cp.z - j.cell.z) * e2;
        if(s.u >= 1){ s.u = 0; s.state = 'gripOut'; }
        break;
      case 'gripOut':   // 팔이 닫히며 집음
        s.u += dt/0.5;
        setArms(f, 0.95 + ((R + 0.07) - 0.95) * ease(Math.min(1, s.u)));
        if(s.u >= 1){
          var yl = r.root.position.y - FLOOR;
          hall.remove(r.root); f.group.add(r.root);
          r.root.rotation.set(0,0,0);
          r.root.position.set(0, yl, CARRY_Z);
          if(j.demo) hideTop(j.cell, j.idx, false);   // 시연이면 원래 롤을 되돌려 놓음
          s.u = 0; s.y0 = f.lift; s.state = 'lowerOut';
        }
        break;
      case 'lowerOut':
        s.u += dt/0.9;
        var cy = s.y0 + ((0.6 + r.len/2) - s.y0) * ease(Math.min(1, s.u));
        r.root.position.y = cy; setLift(f, cy);
        if(s.u >= 1){ s.back = backRoute(s.path, HOMES[f.id]); s.bi = 0; s.state = 'carryBack'; }
        break;
      case 'carryBack':
        var bw = s.back[s.bi];
        if((bw.rev ? driveBack(f, bw.x, bw.z, dt) : drive(f, bw.x, bw.z, dt, bw.h))){
          s.bi++;
          if(s.bi >= s.back.length){ s.u = 0; s.y0 = f.lift; s.state = 'loadUp'; }
        }
        break;
      case 'loadUp':    // 화물차 적재함 높이로 올림
        s.u += dt/0.9;
        var ly = s.y0 + (2.4 - s.y0) * ease(Math.min(1, s.u));
        r.root.position.y = ly; setLift(f, ly);
        if(s.u >= 1){ s.u = 0; s.state = 'loadIn'; }
        break;
      case 'loadIn':    // 적재함 안으로 밀어 넣음
        s.u += dt/1.0;
        r.root.position.z = CARRY_Z - 1.7 * ease(Math.min(1, s.u));
        if(s.u >= 1){
          f.group.remove(r.root); s.roll = null;
          loaded[j.truck]++; refreshTruckLabel(j.truck);
          s.u = 0; s.state = 'release';
        }
        break;
      case 'release':
        s.u += dt/0.8;
        setArms(f, (R + 0.07) + (0.95 - (R + 0.07)) * ease(Math.min(1, s.u*2)));
        setLift(f, Math.max(0.9, f.lift - 3.0*dt));
        if(s.u >= 1 && f.lift <= 0.92){ setArms(f, 0.85); s.state = 'idle'; }
        break;
    }
  }

  /* ---------- 재고 불러오기 ---------- */
  function loadStock(rows, label){
    var prevByKey = stockByKey, wasLive = liveLoaded;
    var prevSnap = slots.map(function(sl){ return {key:sl.key, t:sl.t}; });
    DATA_LABEL = label || DATA_LABEL;
    stockList = buildStock(rows);
    var seenT = {}; typeList = [];
    stockList.forEach(function(o){ if(!seenT[o.type]){ seenT[o.type] = 1; typeList.push(o.type); } });
    typeList.sort();
    if(stockList.length){ wLo = stockList[0].w; wHi = stockList[stockList.length-1].w; }
    allocate(); updateSectLabels(); buildFilter();
    recolor(); updateLegend(); paint(); renderInfo(); renderSummary();
    liveLoaded = DATA_LABEL.indexOf('구글시트') === 0 && stockList.length > 0;
    if(wasLive && liveLoaded) enqueueEvents(prevByKey, prevSnap);   // 시트 연동 상태에서 이전 값과 달라진 만큼만 동작 생성
  }
  window.loadStock = loadStock;   // loadStock([{code:'9160', type:'S', gsm:120, width:1600, kg:28034, rolls:22}, ...], '재고현황 시트')

  /* ---------- 시작 ---------- */
  /* ---------- 구글시트(Apps Script 웹 앱) 연동 ----------
     아래 WEB_APP_URL에 웹 앱 주소(/exec)를 적습니다. 주소 끝에 type= 이 없으면 type=stock3d 가 자동으로 붙습니다. */
  var WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbzbcasgRsHb3l6ny66A6_s6eUzw9rC5PCgZBs7EBL081DVxur_XAUqcAT555c_J62Hu/exec?type=inventory';
  var REFRESH_MS = 3*60*1000;   // 자동 새로고침 간격

  function currentUrl(){
    var u = WEB_APP_URL;
    return (u && u.indexOf('YOUR_') !== 0) ? u.trim() : '';
  }

  // 응답 형식 두 가지를 모두 지원: ① ?type=stock3d (헤더 포함 2차원 배열) ② ?type=inventory (객체 배열)
  function toRows(data){
    if(!Array.isArray(data)){
      throw new Error(data && data.error ? String(data.error) : '응답이 배열이 아닙니다. 주소 끝에 ?type=stock3d 가 필요합니다.');
    }
    var out = [];
    if(!data.length) return out;
    if(Array.isArray(data[0])){
      var head = data[0].map(String);
      var ix = function(name, def){ var k = head.indexOf(name); return k >= 0 ? k : def; };
      var iC = ix('창고코드',1), iN = ix('품목명',4), iT = ix('지종',5), iG = ix('평량',6), iW = ix('지폭',7), iK = ix('재고수량(kg)',8), iR = ix('롤수',9);
      data.slice(1).forEach(function(r){
        var pn = parseName(r[iN]);
        out.push({code:r[iC], type:r[iT] || pn.type, gsm:r[iG] || pn.gsm, width:r[iW], kg:r[iK], rolls:r[iR]});
      });
    } else {
      data.forEach(function(o){
        var pn2 = parseName(o['품목명']);
        out.push({code:o['창고코드'], type:o['지종'] || pn2.type, gsm:o['평량'] || pn2.gsm, width:o['지폭'],
                  kg:(o['재고수량(kg)'] !== undefined ? o['재고수량(kg)'] : o['재고수량']), rolls:o['롤수']});
      });
    }
    return out;
  }

  function hhmm(){
    var d = new Date(), p = function(n){ return (n < 10 ? '0' : '') + n; };
    return p(d.getHours()) + ':' + p(d.getMinutes());
  }
  function useSample(reason){
    statusNote = reason;
    loadStock(sampleRows(), '샘플 데이터 (시트 미연동)');
  }
  var fetching = false, lastSig = '', retryN = 0;
  function fetchStock(){
    var base = currentUrl();
    if(!base){ if(!stockList.length) useSample('연동 주소가 없습니다. 파일의 WEB_APP_URL에 웹 앱 주소를 적어주세요.'); return; }
    if(fetching) return;
    fetching = true;
    var url = base + (base.indexOf('?') >= 0 ? '&' : '?') + (/[?&]type=/.test(base) ? '' : 'type=stock3d&') + '_=' + Date.now();
    statusNote = '불러오는 중…'; renderSummary();
    fetch(url).then(function(r){ return r.text(); }).then(function(txt){
      var data;
      try{ data = JSON.parse(txt); }
      catch(e){
        // JSON이 아니라 HTML이 온 경우: 어떤 페이지인지(제목/첫 문장)를 화면에 보여줌
        var tm = /<title[^>]*>([^<]*)<\/title>/i.exec(txt);
        var plain = txt.replace(/<[^>]*>/g,' ').replace(/\s+/g,' ').trim().slice(0,80);
        throw new Error('서버가 JSON 대신 HTML 페이지를 보냄 → ' + ((tm && tm[1].trim()) || plain || '내용 없음') + ' (로그인·권한·호출 한도 문제일 수 있음)');
      }
      var rows = toRows(data);
      var kept = rows.filter(function(r){ return String(r.code) === '9160'; });
      if(!kept.length) throw new Error('창고코드 9160 재고가 없습니다.');
      statusNote = ''; retryN = 0;
      var sig = JSON.stringify(kept.map(function(r){ return [r.width, r.rolls, r.kg, r.type, r.gsm]; }));
      var label = '구글시트 연동 (9160) · ' + hhmm() + ' 갱신';
      if(sig === lastSig && stockList.length){ DATA_LABEL = label; renderSummary(); }   // 변경 없으면 화면은 그대로
      else { lastSig = sig; loadStock(rows, label); }
    }).catch(function(err){
      console.error('재고 연동 실패:', err);
      var msg = '연동 실패: ' + (err && err.message ? err.message : err);
      var wait = retryN < 3 ? [20, 60, 120][retryN] : 0;
      var tail = wait ? ', ' + wait + '초 뒤 재시도 ' + (retryN + 1) + '/3' : '';
      if(stockList.length && DATA_LABEL.indexOf('구글시트') === 0){ statusNote = msg + ' (이전 데이터 유지' + tail + ')'; renderSummary(); }
      else useSample(msg + ' → 샘플 표시 중');
      if(wait){ retryN++; setTimeout(fetchStock, wait*1000); }   // 일시적 오류일 수 있어 간격을 늘려가며 다시 시도
    }).then(function(){ fetching = false; });
  }
  document.getElementById('bRefresh').addEventListener('click', fetchStock);
  setInterval(function(){ if(currentUrl()){ retryN = 0; fetchStock(); } }, REFRESH_MS);

  loadStock([], '불러오는 중…');
  fetchStock();
  setInterval(pollIncar, 20000); pollIncar();
  var loadBusy = false;
  function pollLoadItems(){                                // 거래계획번호별 '지금 싣는 창고'(시트 '상차판정')를 읽음
    if(!window.fetch || loadBusy) return;
    loadBusy = true;
    var lc = window.AbortController ? new AbortController() : null, lto = lc ? setTimeout(function(){ lc.abort(); }, 30000) : null;
    fetch(WEB_APP_URL.split('?')[0] + '?type=loadstate&_=' + Date.now(), {credentials:'omit', cache:'no-store', signal: lc ? lc.signal : undefined})
      .then(function(r){ if(lto) clearTimeout(lto); loadBusy = false; if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(j){
        if(!Array.isArray(j)) throw new Error('형식 오류');
        var m = {};
        j.forEach(function(p){ if(p && p.plan) m[String(p.plan).trim()] = {total:+p.total || 0, w9160:+p.w9160 || 0, w9190:+p.w9190 || 0, scanned:+p.scanned || 0, curWh:String(p.curWh || '')}; });
        loadByPlan = m;
        if(!loadTried) releasePending(); else if(lastIncarRows) applyIncar(lastIncarRows);       // 롤 구성이 바뀌면 표시 차량을 다시 판정
      })
      .catch(function(){ if(lto) clearTimeout(lto); loadBusy = false; if(!loadTried) releasePending(); });                                // 시트가 없거나 실패하면 기존 방식(창고코드만)으로 계속
  }
  setInterval(pollLoadItems, 30000); pollLoadItems();
  setTimeout(function(){ if(!loadTried) releasePending(); }, 12000);              // 롤 목록 응답이 너무 늦으면 기존 방식으로 먼저 진행
  updateCam();

  var v3 = new THREE.Vector3();
  var dockTop = [], dockBot = [];
  function dockPlace(list, top, w, h){
    list.sort(function(a,b){ return a.sx - b.sx; });
    var tb = document.querySelector ? document.querySelector('.toolbar') : null;
    var y = top ? ((tb && tb.offsetHeight ? tb.offsetHeight : 34) + 20) : (h - 10);
    var cursor = top ? 8 : 250;                         // 아래쪽은 왼쪽 아래 범례 상자를 피함
    list.forEach(function(it){
      var l = it.l, el = l.el;
      var wd = el.offsetWidth || (el.textContent.length*7 + 16), ht = el.offsetHeight || 20;
      var cx = Math.min(Math.max(it.sx, cursor + wd/2), w - 8 - wd/2);
      cursor = cx + wd/2 + 4;
      el.style.display = 'block'; el.style.left = cx + 'px'; el.style.top = y + 'px';
      el.style.transform = top ? 'translate(-50%,0)' : 'translate(-50%,-100%)';
      if(!l.line){ l.line = document.createElement('div'); l.line.className = 'dline'; labelsEl.appendChild(l.line); }
      var x0 = cx, y0 = top ? y + ht : y - ht, dx = it.sx - x0, dy = it.sy - y0, len = Math.hypot(dx, dy);
      l.line.style.display = 'block'; l.line.style.left = x0 + 'px'; l.line.style.top = y0 + 'px';
      l.line.style.width = len + 'px'; l.line.style.transform = 'rotate(' + Math.atan2(dy, dx) + 'rad)';
    });
  }
  function updateLabels(){
    if(!showLabels) return;
    var w = stage.clientWidth, h = stage.clientHeight;
    dockTop.length = 0; dockBot.length = 0;
    labels.forEach(function(l){
      if(l.minor && st.radius > 75){ l.el.style.display = 'none'; return; }
      if(l.fn){ var q = l.fn(); if(!q){ l.el.style.display = 'none'; return; } l.x = q[0]; l.y = q[1]; l.z = q[2]; }
      v3.set(l.x, l.y, l.z).project(cam);
      if(v3.z > 1){ l.el.style.display = 'none'; if(l.line) l.line.style.display = 'none'; return; }
      var sx = (v3.x*0.5+0.5)*w, sy = (-v3.y*0.5+0.5)*h;
      if(l.dock){ (sy < h/2 ? dockTop : dockBot).push({l:l, sx:sx, sy:sy}); return; }
      l.el.style.display = 'block'; l.el.style.transform = '';
      l.el.style.left = sx + 'px'; l.el.style.top = sy + 'px';
    });
    dockPlace(dockTop, true, w, h); dockPlace(dockBot, false, w, h);
  }
  var cneedle = document.getElementById('cneedle');
  var last = performance.now();
  function loop(now){
    var dt = Math.min(0.05, (now - last)/1000); last = now;
    if(sim.on){ stepTrucks(dt); stepAmbient(dt); stepIn(dt); stepOut(dt); }
    if(cneedle) cneedle.style.transform = 'rotate(' + (st.theta*180/Math.PI) + 'deg)';
    renderer.render(scene, cam);
    updateLabels();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
<script type="text/plain" id="code-yd">(function(){
  'use strict';

  /* ---------- 기준값 (초안: 현장 값으로 바꾸면 됨) ---------- */
  var OX = 62.2855, OZ = 11.1345, FLOOR = 0.2;                       // 야적장 좌표(m) → 장면 중심 보정

    var pts=[];
    function seg(a,b){ pts.push(new THREE.Vector3(a[0],a[1],a[2]), new THREE.Vector3(b[0],b[1],b[2])); }
    cys.forEach(function(y){
      var z=toW(0,y)[1];
      seg([xW,WH,z],[xC,RIDGE,z]); seg([xC,RIDGE,z],[xE,WH,z]);
      seg([xW,WH,z],[xE,WH,z]);   seg([xC,RIDGE,z],[xC,WH,z]);
    });
    [[xW,WH],[xC,RIDGE],[xE,WH],[(xW+xC)/2,(WH+RIDGE)/2],[(xC+xE)/2,(WH+RIDGE)/2]].forEach(function(q){
      seg([q[0],q[1],zN],[q[0],q[1],zS]);
    });
    roofGroup.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(pts), trussMat));

    function quad(a,b,c,d){
      var g=new THREE.BufferGeometry();
      var v=[a,b,c, a,c,d], arr=[];
      v.forEach(function(p){ arr.push(p[0],p[1],p[2]); });
      g.setAttribute('position', new THREE.Float32BufferAttribute(arr,3));
      g.computeVertexNormals();
      return new THREE.Mesh(g, roofMat);
    }
    roofGroup.add(quad([xW,WH,zN],[xC,RIDGE,zN],[xC,RIDGE,zS],[xW,WH,zS]));
    roofGroup.add(quad([xC,RIDGE,zN],[xE,WH,zN],[xE,WH,zS],[xC,RIDGE,zS]));
    var ex0=toW(EX0,0)[0], ezS=toW(0,EY1)[1];
    roofGroup.add(quad([ex0,WH,zS],[xE,WH,zS],[xE,WH,ezS],[ex0,WH,ezS]));
  })();

  /* ---------- 카메라 (간단한 오빗) ---------- */
  var st = {target:new THREE.Vector3(0,0,0), theta:0, phi:0.95, radius:235};
  function clamp(v,a,b){ return Math.min(Math.max(v,a),b); }
  function updateCam(){
    st.phi = clamp(st.phi, 0.06, 1.48);
    st.radius = clamp(st.radius, 35, 600);
    var sp = Math.sin(st.phi);
    cam.position.set(
      st.target.x + st.radius*sp*Math.sin(st.theta),
      st.target.y + st.radius*Math.cos(st.phi),
      st.target.z + st.radius*sp*Math.cos(st.theta)
    );
    cam.lookAt(st.target);
  }
  function setView(t,p,r){ st.target.set(0,0,0); st.theta=t; st.phi=p; st.radius=r; updateCam(); }

  /* ---------- 라벨 ---------- */
  var showAll = false;
  Z.forEach(function(z){
    var d = document.createElement('div');
    d.className = 'lbl';
    d.textContent = z.name;
    d.style.display = 'none';
    labelsEl.appendChild(d);
    z.label = d;
  });
  var v3 = new THREE.Vector3();
  function updateLabels(){
    var w = stage.clientWidth, h = stage.clientHeight;
    Z.forEach(function(z){
      var show = showAll || z.lbl || z === selected || z === hovered;
      if(!show){ z.label.style.display='none'; return; }
      v3.set(z.cx, (z.ly || (z.h+0.5)), z.cz).project(cam);
      if(v3.z > 1){ z.label.style.display='none'; return; }
      z.label.style.display = 'block';
      z.label.style.left = ((v3.x*0.5+0.5)*w) + 'px';
      z.label.style.top  = ((-v3.y*0.5+0.5)*h) + 'px';
      z.label.className = 'lbl' + ((z===selected||z===hovered) ? ' on' : '');
    });
  }

  /* ---------- 선택 / 호버 ---------- */
  var selected = null, hovered = null;
  function paint(){
    Z.forEach(function(z){
      var e = 0x000000;
      if(z === selected) e = 0x3a3a3a; else if(z === hovered) e = 0x1c1c1c;
      z.mat.emissive.setHex(e);
      z.edges.forEach(function(l){ l.material = (z===selected) ? edgeSelMat : edgeMat; });
    });
  }
  function refreshMarkers(){
    Z.forEach(function(z){
      var s = getStatus(z);
      z.marker.visible = (s !== 'ok');
      if(s !== 'ok') z.marker.material.color.set(STATUS[s].color);
    });
  }

  /* ---------- 패널 ---------- */
  var infoEl = document.getElementById('info');
  var listEl = document.getElementById('list');

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if(cls) e.className = cls;
    if(text !== undefined) e.textContent = text;
    return e;
  }

  function renderInfo(){
    infoEl.textContent = '';
    if(!selected){
      infoEl.appendChild(el('div','empty','구역을 클릭하거나 아래 목록에서 선택하세요.'));
      return;
    }
    var z = selected;
    infoEl.appendChild(el('h2', '', z.name));
    var dl = el('dl');
    function row(k,v){ dl.appendChild(el('dt','',k)); dl.appendChild(el('dd','',v)); }
    row('분류', CAT[z.cat].name);
    row('면적', '약 ' + Math.round(z.area).toLocaleString('ko-KR') + ' ㎡');
    row('높이', z.hLabel || (z.h + ' m (가정)'));
    if(z.count) row('롤 수', '약 ' + z.count + '개 (추정)');
    infoEl.appendChild(dl);

    var seg = el('div','seg');
    Object.keys(STATUS).forEach(function(k){
      var b = el('button','',STATUS[k].name);
      b.dataset.s = k;
      b.setAttribute('aria-pressed', getStatus(z)===k ? 'true' : 'false');
      b.addEventListener('click', function(){
        store.status[z.id] = k; saveStore();
        refreshMarkers(); renderInfo(); renderList();
      });
      seg.appendChild(b);
    });
    infoEl.appendChild(seg);

    var ta = el('textarea');
    ta.placeholder = '메모';
    ta.value = store.memo[z.id] || '';
    ta.addEventListener('input', function(){ store.memo[z.id] = ta.value; saveStore(); });
    infoEl.appendChild(ta);
  }

  function renderList(){
    listEl.textContent = '';
    Z.forEach(function(z){
      var b = el('button');
      var sw = el('span','sw'); sw.style.background = '#' + ('000000'+(z.color !== undefined ? z.color : CAT[z.cat].color).toString(16)).slice(-6);
      b.appendChild(sw);
      b.appendChild(el('span','',z.name));
      var s = getStatus(z);
      if(s !== 'ok'){
        var d = el('span','dot st'); d.style.background = STATUS[s].color; d.title = STATUS[s].name;
        b.appendChild(d);
      }
      if(z === selected) b.setAttribute('aria-current','true');
      b.addEventListener('click', function(){ select(z, true); });
      listEl.appendChild(b);
    });
  }

  function select(z, focus){
    selected = z;
    if(z && focus){
      st.target.set(z.cx, 0, z.cz);
      st.radius = Math.max(65, z.size*2.4);
      updateCam();
    }
    paint(); renderInfo(); renderList();
  }

  /* ---------- 범례 ---------- */
  (function(){
    var lg = document.getElementById('legend');
    Object.keys(CAT).forEach(function(k){
      var s = el('span');
      var sw = el('i','sw'); sw.style.background = '#' + ('000000'+CAT[k].color.toString(16)).slice(-6);
      s.appendChild(sw); s.appendChild(document.createTextNode(CAT[k].name));
      lg.appendChild(s);
    });
    ['warn','check'].forEach(function(k){
      var s = el('span');
      var d = el('i','dot'); d.style.background = STATUS[k].color;
      s.appendChild(d); s.appendChild(document.createTextNode(STATUS[k].name));
      lg.appendChild(s);
    });
  })();

  /* ---------- 입력 ---------- */
  var ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
  function pick(ev){
    var r = canvas.getBoundingClientRect();
    mouse.x = ((ev.clientX - r.left)/r.width)*2 - 1;
    mouse.y = -((ev.clientY - r.top)/r.height)*2 + 1;
    ray.setFromCamera(mouse, cam);
    var hit = ray.intersectObjects(pickables, false)[0];
    return hit ? hit.object.userData.zone : null;
  }

  var drag = null;
  canvas.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  canvas.addEventListener('pointerdown', function(e){
    canvas.setPointerCapture(e.pointerId);
    drag = {x:e.clientX, y:e.clientY, sx:e.clientX, sy:e.clientY, pan:(e.button===2 || e.shiftKey), moved:false};
  });
  canvas.addEventListener('pointermove', function(e){
    if(drag){
      var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
      drag.x = e.clientX; drag.y = e.clientY;
      if(Math.abs(e.clientX-drag.sx) + Math.abs(e.clientY-drag.sy) > 4) drag.moved = true;
      if(drag.pan){
        var k = st.radius*0.0016, ct = Math.cos(st.theta), sn = Math.sin(st.theta);
        st.target.x += -ct*dx*k + (-sn)*dy*k;
        st.target.z +=  sn*dx*k + (-ct)*dy*k;
      } else {
        st.theta -= dx*0.006;
        st.phi   -= dy*0.006;
      }
      updateCam();
    } else {
      var z = pick(e);
      if(z !== hovered){ hovered = z; canvas.style.cursor = z ? 'pointer' : 'default'; paint(); }
    }
  });
  canvas.addEventListener('pointerup', function(e){
    if(drag && !drag.moved && !drag.pan){ select(pick(e), false); }
    drag = null;
  });
  canvas.addEventListener('pointerleave', function(){ if(!drag && hovered){ hovered = null; paint(); } });
  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    st.radius *= Math.exp(e.deltaY*0.001);
    updateCam();
  }, {passive:false});

  document.getElementById('bReset').addEventListener('click', function(){ setView(0,0.95,235); });
  document.getElementById('bTop').addEventListener('click', function(){ setView(0,0.06,270); });
  var bl = document.getElementById('bLabels');
  bl.addEventListener('click', function(){
    showAll = !showAll;
    bl.setAttribute('aria-pressed', showAll ? 'true' : 'false');
  });

  /* ---------- 테마 / 리사이즈 ---------- */
  function cssVar(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
  function applyTheme(){
    renderer.setClearColor(cssVar('--scene-bg') || '#dfe4eb');
    ground.material.color.set(cssVar('--ground') || '#f4f5f7');
    edgeMat.color.set(cssVar('--edge') || '#1b2330');
    outlineMat.color.set(cssVar('--muted') || '#888888');
  }
  applyTheme();
  try{
    var mq = window.matchMedia('(prefers-color-scheme: dark)');
    if(mq.addEventListener) mq.addEventListener('change', applyTheme);
  }catch(e){}

  function resize(){
    var w = stage.clientWidth, h = stage.clientHeight;
    if(!w || !h) return;
    renderer.setSize(w, h, false);
    cam.aspect = w/h;
    cam.updateProjectionMatrix();
  }
  if(window.ResizeObserver){ new ResizeObserver(resize).observe(stage); }
  window.addEventListener('resize', resize);
  resize();

  /* ---------- 시작 ---------- */
  refreshMarkers();
  renderInfo();
  renderList();
  paint();
  updateCam();

  function loop(t){
    var s = 1 + Math.sin(t*0.004)*0.18;
    Z.forEach(function(z){ if(z.marker.visible) z.marker.scale.setScalar(s); });
    renderer.render(scene, cam);
    syncCams();
    updateLabels();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);


  /* ---------- 창고 재고 · 원료 야적을 이 지도 장면 안에서 직접 실행 ---------- */
  ['wh','whgate','wr1','wr2','wr3','wr4','wr5','wr6','fl1','paper','rt1','rt2','rt3','rt4'].forEach(function(id){   // 지도의 단순 모형은 숨기고 상세 모형이 대신 움직임 (클릭 선택은 그대로)
    var zz = Z.filter(function(q){ return q.id === id; })[0]; if(zz){ zz.group.visible = false; zz.lbl = false; }
  });
  whDetail.visible = false; roofGroup.visible = false;
  (function(){ var inc = Z.filter(function(q){ return q.id === 'incin'; })[0]; if(inc){ var c2 = toW((148+700)/2, (735+797)/2); inc.cx = c2[0]; inc.cz = c2[1]; inc.marker.position.set(inc.cx, inc.marker.position.y, inc.cz); } })();   // 소각로 점검 표시는 남은 건물 중앙에

  var realDoc = document, realWin = window, MODS = {};
  function dummyEl(){ return {style:{}, dataset:{}, children:[], classList:{add:function(){},remove:function(){},toggle:function(){return false;},contains:function(){return false;}},
    appendChild:function(c){return c;}, removeChild:function(){}, addEventListener:function(){}, removeEventListener:function(){}, setAttribute:function(){}, getAttribute:function(){return null;},
    setPointerCapture:function(){}, getBoundingClientRect:function(){return {left:0,top:0,width:1,height:1};}, clientWidth:1, clientHeight:1, offsetWidth:0, offsetHeight:0,
    querySelector:function(){return null;}, querySelectorAll:function(){return [];}, textContent:'', innerHTML:'', value:''}; }
  function startModule(key){
    var pane = realDoc.getElementById('pane-' + key), lbl = realDoc.getElementById(key + '-labels');
    var idset = {}; (pane.getAttribute('data-ids') || '').split(',').forEach(function(i){ if(i) idset[i] = 1; });
    var root = new THREE.Group(); scene.add(root);
    var camP = new THREE.PerspectiveCamera(42, 1, 0.5, 2500);
    function sel(s){ Object.keys(idset).forEach(function(i){ s = s.split('#' + i).join('#' + key + '-' + i); }); return s; }
    var doc = {
      getElementById: function(id){ if(id === 'stage') return stage; if(id === 'labels') return lbl; if(id === 'c') return MODS[key].canvasProxy; if(id === 'tip') return MODS[key].tip; if(idset[id]) return realDoc.getElementById(key + '-' + id) || dummyEl(); return dummyEl(); },
      createElement: function(t){ return realDoc.createElement(t); }, createTextNode: function(t){ return realDoc.createTextNode(t); },
      querySelectorAll: function(s){ return pane.querySelectorAll(sel(s)); }, querySelector: function(s){ return pane.querySelector(sel(s)); },
      documentElement: realDoc.documentElement, body: realDoc.body
    };
    var win = new Proxy(realWin, {
      get: function(t, p){ var v = t[p]; return (typeof v === 'function' && p !== 'ResizeObserver') ? v.bind(t) : v; },
      set: function(t, p, v){ t[p] = v; return true; }
    });
    var T2 = Object.create(THREE);
    T2.Scene = function(){ return root; };
    T2.PerspectiveCamera = function(){ return camP; };
    T2.WebGLRenderer = function(){ return {setPixelRatio:function(){}, setSize:function(){}, setClearColor:function(){}, render:function(){}, domElement:dummyEl()}; };
    T2.AmbientLight = function(){ return new THREE.Object3D(); };
    T2.DirectionalLight = function(){ return new THREE.Object3D(); };
    var code = realDoc.getElementById('code-' + key).textContent;
    var tipEl = realDoc.createElement('div'); tipEl.className = 'modtip'; stage.appendChild(tipEl);       // 롤·차량 위에 올렸을 때 말풍선
    var proxy = dummyEl(), PL = {};                                                                      // 모듈의 캔버스 입력을 받아 두는 대역
    proxy.addEventListener = function(t, f){ (PL[t] = PL[t] || []).push(f); };
    proxy.getBoundingClientRect = function(){ return realDoc.getElementById('c').getBoundingClientRect(); };
    proxy.emit = function(t, e){ (PL[t] || []).forEach(function(f){ try{ f(e); }catch(err){ console.error(err); } }); };
    MODS[key] = {root:root, cam:camP, canvasProxy:proxy, tip:tipEl};
    new Function('document', 'window', 'THREE', code)(doc, win, T2);
  }
  function syncCams(){
    Object.keys(MODS).forEach(function(k){
      var c = MODS[k].cam;
      c.position.copy(cam.position); c.quaternion.copy(cam.quaternion);
      c.projectionMatrix.copy(cam.projectionMatrix); c.projectionMatrixInverse.copy(cam.projectionMatrixInverse);
      c.matrixWorld.copy(cam.matrixWorld); c.matrixWorldInverse.copy(cam.matrixWorldInverse); c.aspect = cam.aspect;
    });
  }
  ['wh','yd'].forEach(function(k){ try{ startModule(k); }catch(e){ console.error('모듈 실행 오류 ' + k, e); } });
  // 지도 캔버스의 마우스 입력 중 '올려 보기'와 '클릭 선택'만 창고·원료 모듈에 전달 (회전·이동은 지도가 그대로 처리)
  (function(){
    var cv = realDoc.getElementById('c'), down = null;
    function fwd(t, e){ Object.keys(MODS).forEach(function(k){ MODS[k].canvasProxy.emit(t, e); }); }
    function fake(e){ return {clientX:e.clientX, clientY:e.clientY, button:e.button, shiftKey:e.shiftKey, pointerId:e.pointerId, preventDefault:function(){}}; }
    cv.addEventListener('pointermove', function(e){ if(e.buttons) return; fwd('pointermove', fake(e)); });
    cv.addEventListener('pointerdown', function(e){ down = {x:e.clientX, y:e.clientY, b:e.button, s:e.shiftKey}; fwd('pointerleave', fake(e)); });
    cv.addEventListener('pointerup', function(e){
      if(down && down.b === 0 && !down.s && Math.abs(e.clientX - down.x) + Math.abs(e.clientY - down.y) <= 4){ fwd('pointerdown', fake(e)); fwd('pointerup', fake(e)); }
      down = null;
    });
    cv.addEventListener('pointerleave', function(e){ fwd('pointerleave', fake(e)); });
  })();

  // 패널 탭 / 카메라 이동
  var FLY = {wh:{t:[52.31,0,16.74], th:0, ph:0.06, r:70}, yd:{t:[-27.29,0,18.87], th:0, ph:0.06, r:80}};
  function fly(k){
    var f = FLY[k]; st.target.set(f.t[0], f.t[1], f.t[2]); st.theta = f.th; st.phi = f.ph; st.radius = f.r; updateCam();
    if(k === 'wh'){ var rb = realDoc.getElementById('wh-bRoof'); if(rb && rb.getAttribute('aria-pressed') === 'true') rb.click(); }     // 위에서 볼 때는 지붕을 걷어 안이 보이게
  }
  window.mapCamera = function(x, z, r, th, ph){ st.target.set(x, 0, z); st.radius = r; if(th !== undefined) st.theta = th; if(ph !== undefined) st.phi = ph; updateCam(); };   // 카메라를 원하는 곳으로 옮기는 보조 함수
  function showTab(k){
    Array.prototype.forEach.call(realDoc.querySelectorAll('#ptabs button'), function(b){ b.setAttribute('aria-pressed', b.dataset.pt === k ? 'true' : 'false'); });
    Array.prototype.forEach.call(realDoc.querySelectorAll('.ptab'), function(p){ p.hidden = (p.dataset.pt !== k); });
  }
  Array.prototype.forEach.call(realDoc.querySelectorAll('#ptabs button'), function(b){ b.addEventListener('click', function(){ showTab(b.dataset.pt); }); });
  Array.prototype.forEach.call(realDoc.querySelectorAll('.fly'), function(b){ b.addEventListener('click', function(){ fly(b.dataset.fly); }); });
  realDoc.getElementById('bFlyWh').addEventListener('click', function(){ fly('wh'); showTab('wh'); });
  realDoc.getElementById('bFlyYd').addEventListener('click', function(){ fly('yd'); showTab('yd'); });
  (function(){
    var appEl = realDoc.getElementById('app'), bp = realDoc.getElementById('bPanel');
    bp.addEventListener('click', function(){ var off = appEl.classList.toggle('nopanel'); bp.setAttribute('aria-pressed', off ? 'false' : 'true'); });
  })();
  showTab('map');

  // 외부 데이터 연동용: applyStatus({wh:'warn', pm1:'ok', ...})
  window.applyStatus = function(map){
    Object.keys(map||{}).forEach(function(id){ if(STATUS[map[id]]) store.status[id] = map[id]; });
    refreshMarkers(); renderInfo(); renderList();
  };
})();
</script>
</body>
</html>
