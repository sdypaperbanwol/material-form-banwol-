<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>자재 신청</title>
<style>
  :root { --ink:#1d2433; --sub:#6b7280; --line:#e5e7eb; --line-s:#cbd0d8; --bg:#f6f7f9; --accent:#1f4e8c; --accent-l:#eaf1fb; --warn:#b45309; --danger:#b91c1c; }
  * { box-sizing:border-box; }
  body { font-family:-apple-system,'Segoe UI','Malgun Gothic',sans-serif; background:var(--bg); color:var(--ink); margin:0; padding:0 0 104px; font-size:15px; }
  .wrap { max-width:640px; margin:0 auto; padding:14px; }
  h2 { margin:6px 0 12px; font-size:1.2rem; font-weight:600; }
  .hidden { display:none !important; }
  button { font-family:inherit; cursor:pointer; }
  button:focus-visible, input:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }

  /* 로그인 */
  #notice { background:#fff7e6; border:1px solid #f3dfb3; color:#7a5200; padding:10px 12px; border-radius:10px; font-size:.9rem; white-space:pre-wrap; margin-bottom:12px; }
  .login-box input { display:block; width:100%; padding:14px; font-size:1.05rem; margin:8px 0; border:1px solid var(--line-s); border-radius:10px; }
  .primary { background:var(--accent); color:#fff; border:none; border-radius:10px; padding:14px; font-size:1rem; width:100%; }
  .primary:disabled { background:#c3c8d0; }
  #loginMsg { color:var(--danger); font-size:.9rem; min-height:1.2em; margin-top:8px; }

  /* 상단 */
  .topbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
  .who { font-size:.85rem; color:var(--sub); }
  .guide { color:var(--sub); font-size:.84rem; margin:0 0 10px; line-height:1.5; }
  .search { width:100%; padding:12px 14px; font-size:1rem; border:1px solid var(--line-s); border-radius:10px; margin-bottom:12px; background:#fff; }

  /* 목록 */
  .cat { background:#fff; border:1px solid var(--line); border-radius:12px; margin-bottom:10px; overflow:hidden; }
  .cat.open { border-color:var(--line-s); }
  .cat-head { display:flex; }
  .cat-toggle { flex:1; display:flex; align-items:center; gap:8px; text-align:left; background:none; border:none; padding:15px 14px; font-size:1.02rem; font-weight:600; color:inherit; }
  .arrow { margin-left:auto; color:var(--sub); transition:transform .15s; }
  .cat.open > .cat-head .arrow { transform:rotate(90deg); }
  .badge { background:var(--accent); color:#fff; font-size:.72rem; font-weight:600; border-radius:10px; padding:1px 7px; }
  .cat-body { border-top:1px solid var(--line); }
  .type-box { border-top:1px solid var(--line); }
  .type-box:first-child { border-top:none; }
  .type-toggle { width:100%; display:flex; align-items:center; gap:8px; background:#f8f9fb; border:none; padding:12px 14px; font-size:.97rem; font-weight:600; text-align:left; color:inherit; }
  .cnt { margin-left:auto; font-size:.8rem; font-weight:400; color:var(--sub); }
  .cnt + .arrow { margin-left:4px; }
  .type-box.open .type-toggle .arrow { transform:rotate(90deg); }
  .type-photo, .row-photo { display:inline-flex; align-items:center; color:var(--sub); padding:2px 6px; background:none; border:none; }
  .type-photo svg, .row-photo svg { width:18px; height:18px; }
  .row { display:flex; align-items:center; gap:8px; padding:8px 14px 8px 11px; border-top:1px solid var(--line); border-left:3px solid transparent; }
  .row.sel { border-left-color:var(--accent); background:var(--accent-l); }
  .row.sel .size { font-weight:600; }
  .row.out .size { color:var(--sub); }
  .size { flex:1; min-width:0; word-break:break-word; }
  .stock { font-size:.8rem; color:var(--sub); white-space:nowrap; }
  .stock.none { color:var(--warn); }
  .qty { display:flex; border:1px solid var(--line-s); border-radius:8px; overflow:hidden; background:#fff; }
  .qty button { width:36px; height:36px; font-size:1.2rem; border:none; background:#fff; color:var(--ink); }
  .qty button:active { background:var(--bg); }
  .qty input { width:44px; height:36px; text-align:center; font-size:1rem; border:none; border-left:1px solid var(--line-s); border-right:1px solid var(--line-s); border-radius:0; padding:0; background:#fff; -moz-appearance:textfield; }
  .qty input::-webkit-outer-spin-button, .qty input::-webkit-inner-spin-button { -webkit-appearance:none; margin:0; }
  .qty input.on { font-weight:600; color:var(--accent); }
  .hint { font-size:.8rem; color:var(--warn); margin:0; padding:8px 14px; border-top:1px solid var(--line); }

  /* 하단 바 */
  #cartBar { position:fixed; left:0; right:0; bottom:0; padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px)); background:#fff; border-top:1px solid var(--line); z-index:50; }
  #cartBar .primary { max-width:612px; display:block; margin:0 auto; }
  .primary .sub { display:block; margin-top:3px; font-size:.78rem; font-weight:400; color:#dbe6f5; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #toast { position:fixed; left:50%; bottom:calc(100px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); background:#1d2433; color:#fff; padding:9px 16px; border-radius:20px; font-size:.9rem; z-index:60; max-width:90%; text-align:center; pointer-events:none; opacity:0; transition:opacity .15s; }
  #toast.show { opacity:1; }

  /* 모달 */
  .modal { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:100; display:flex; align-items:flex-end; justify-content:center; }
  .sheet { background:#fff; width:100%; max-width:640px; max-height:88vh; overflow:auto; border-radius:16px 16px 0 0; padding:16px; animation:up .2s ease-out; }
  @keyframes up { from { transform:translateY(24px); opacity:0; } to { transform:none; opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation:none; } }
  .sheet h3 { margin:0 0 10px; font-size:1.05rem; }
  .close { float:right; background:none; border:none; font-size:1.4rem; color:var(--sub); }
  .cart-row { display:flex; align-items:center; gap:8px; padding:10px 0; border-bottom:1px solid var(--line); }
  .cart-row .t { flex:1; min-width:0; font-size:.92rem; word-break:break-word; }
  .cart-row .t small { display:block; color:var(--sub); }
  .cart-row .t small.w { color:var(--warn); }
  .del { background:none; border:none; color:var(--sub); font-size:1.1rem; padding:6px; }
  textarea { width:100%; margin:12px 0; padding:10px; font-size:1rem; font-family:inherit; border:1px solid var(--line-s); border-radius:10px; resize:none; }
  .photo-item { margin-bottom:18px; }
  .photo-item .cap { font-weight:600; margin-bottom:4px; }
  .photo-item img { width:100%; border:1px solid var(--line); border-radius:10px; min-height:80px; background:#f0f0f0; }

  #overlay { position:fixed; inset:0; background:rgba(0,0,0,.45); z-index:200; display:flex; align-items:center; justify-content:center; color:#000; }
  #overlay span { background:#fff; padding:18px 32px; border-radius:12px; font-size:1.05rem; }
  #boot { position:fixed; inset:0; background:var(--bg); z-index:300; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; color:var(--sub); font-size:.95rem; }
  .spin { width:34px; height:34px; border:3px solid var(--line-s); border-top-color:var(--accent); border-radius:50%; animation:spin .8s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spin { animation:none; } }
  .empty { text-align:center; color:var(--sub); padding:24px 0; }
</style>
</head>
<body>
<div id="boot"><div class="spin"></div><div>불러오는 중입니다...</div></div>
<div class="wrap">

  <!-- 로그인 -->
  <div id="loginView" class="login-box">
    <h2>자재 신청</h2>
    <div id="notice" class="hidden"></div>
    <p style="margin:0">사번과 이름을 입력하세요</p>
    <input id="empId" placeholder="사번" inputmode="numeric" autocomplete="off" />
    <input id="empName" placeholder="이름" autocomplete="off" />
    <button id="loginBtn" class="primary">로그인</button>
    <div id="loginMsg"></div>
  </div>

  <!-- 신청 -->
  <div id="mainView" class="hidden">
    <div class="topbar">
      <h2 style="margin:0">자재 신청</h2>
      <span class="who" id="who"></span>
    </div>
    <p class="guide">+로 수량을 담고, 다 담았으면 맨 아래 장바구니에서 한 번에 신청합니다. +만 눌러서는 신청되지 않습니다.</p>
    <input id="search" class="search" type="search" placeholder="품목 검색 (예: 장갑, 빗자루, ㅈㄱ)" autocomplete="off" />
    <div id="catList"></div>
  </div>
</div>

<!-- 하단 장바구니 바 -->
<div id="cartBar" class="hidden">
  <button id="openCart" class="primary" disabled>품목을 담아주세요</button>
</div>

<!-- 장바구니 모달 -->
<div id="cartModal" class="modal hidden">
  <div class="sheet">
    <button class="close" id="closeCart" aria-label="닫기">✕</button>
    <h3>장바구니</h3>
    <div id="cartList"></div>
    <textarea id="remarks" rows="2" placeholder="비고 (요청사항, 선택)"></textarea>
    <button id="submitBtn" class="primary">이대로 신청하기</button>
  </div>
</div>

<!-- 사진 모달 -->
<div id="photoModal" class="modal hidden">
  <div class="sheet">
    <button class="close" id="closePhoto" aria-label="닫기">✕</button>
    <h3 id="photoTitle">사진</h3>
    <div id="photoContent"></div>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="overlay" class="hidden"><span id="overlayText">처리 중입니다...</span></div>

<script>
const endpoint = 'https://script.google.com/macros/s/AKfycbzinmNuMPi3nJmV80w2J77dcU_7dleh-jobOx7K0tyYDouRMBkfQpJtMElXg-3w0_-R/exec';
const CAM = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>';
const FORM = { 'Content-Type': 'application/x-www-form-urlencoded' };
const INLINE_SINGLE = false;  // true 로 바꾸면 소분류 1개짜리는 펼치지 않고 한 줄로 바로 표시

// 속도 점검용: 주소 끝에 ?debug 를 붙이면 화면 왼쪽 아래에 단계별 걸린 시간(ms)이 표시됨
const T0 = performance.now();
const timings = {};
function mark(k) {
  timings[k] = Math.round(performance.now() - T0);
  if (location.search.includes('debug')) {
    let d = document.getElementById('dbg');
    if (!d) {
      d = document.createElement('div'); d.id = 'dbg';
      d.style.cssText = 'position:fixed;left:6px;bottom:6px;z-index:999;background:#000c;color:#fff;font:11px monospace;padding:6px 8px;border-radius:6px;white-space:pre';
      document.body.appendChild(d);
    }
    d.textContent = Object.entries(timings).map(([a, b]) => a + ': ' + b + 'ms').join('\n');
  }
}
mark('시작');

let user = null;
let categories = [];
let stockIdx = {};          // key -> 재고
let photos = {};            // 대분류 -> [{type,url,name}]
let cart = {};              // key -> {category,type,size,qty}
let itemsPromise = null;
let submitting = false;

const $ = id => document.getElementById(id);
function el(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text !== undefined) e.textContent = text; return e; }
const keyOf = (c, t, s) => [c, t, s].join('||');
function showOverlay(msg) { $('overlayText').textContent = msg || '처리 중입니다...'; $('overlay').classList.remove('hidden'); }
function hideOverlay() { $('overlay').classList.add('hidden'); }

/* ───────── 데이터 로드 (페이지 열자마자 시작) ───────── */
function loadItems() {
  return fetch(endpoint + '?mode=items').then(r => r.json()).then(d => {
    if (d.result !== 'success') throw new Error('목록 오류');
    categories = d.categories;
    stockIdx = {};
    categories.forEach(c => c.types.forEach(t => t.sizes.forEach(s => { stockIdx[keyOf(c.name, t.name, s.size)] = s.stock; })));
  });
}
function loadPhotos() {
  fetch(endpoint + '?mode=photos').then(r => r.json()).then(d => {
    if (d && !d.result) { photos = d; mark('사진목록'); refreshPhotoButtons(); }
  }).catch(() => {});
}
function loadNotice() {
  return fetch(endpoint + '?mode=notice').then(r => r.json()).then(d => {
    const n = (d.notice || '').trim();
    if (n) { const b = $('notice'); b.textContent = n; b.classList.remove('hidden'); }
  }).catch(() => {});
}
function hideBoot() { mark('로딩화면닫힘'); $('boot').classList.add('hidden'); }

itemsPromise = loadItems();
itemsPromise.then(() => { mark('물품목록'); loadPhotos(); }).catch(() => {});
// 공지까지 불러오면 로딩 화면을 닫음 (서버가 느려도 최대 5초까지만 기다림)
const noticeP = loadNotice();
noticeP.then(() => mark('공지'));
Promise.race([noticeP, new Promise(r => setTimeout(r, 5000))]).then(hideBoot);

/* ───────── 로그인 ───────── */
async function handleLogin() {
  const empId = $('empId').value.trim();
  const empName = $('empName').value.trim();
  if (!empId || !empName) { $('loginMsg').textContent = '사번과 이름을 입력해주세요.'; return; }
  $('loginBtn').disabled = true;
  $('loginMsg').textContent = '로그인 중입니다...';
  try {
    const res = await fetch(endpoint, { method: 'POST', headers: FORM, body: new URLSearchParams({ empId, empName }) });
    const data = await res.json();
    if (data.result !== 'success') {
      $('loginMsg').textContent = data.result === 'disabled' ? '신청 권한이 없는 계정입니다.' : '사번 또는 이름이 맞지 않습니다.';
      $('loginBtn').disabled = false;
      return;
    }
    user = { empId, empName };
    $('loginMsg').textContent = '목록을 불러오는 중...';
    try { await itemsPromise; }
    catch (e) { itemsPromise = loadItems(); await itemsPromise; }   // 실패 시 한 번 재시도
    $('who').textContent = `${empName} (${empId})`;
    $('loginView').classList.add('hidden');
    $('mainView').classList.remove('hidden');
    renderCategories();
  } catch (e) {
    $('loginMsg').textContent = '서버 오류: ' + e.message;
    $('loginBtn').disabled = false;
  }
}
$('loginBtn').addEventListener('click', handleLogin);
['empId', 'empName'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); }));

/* ───────── 아코디언 목록 ───────── */
/* ───────── 검색 ───────── */
const CHO = ['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];
function chosung(str) {
  let out = '';
  for (const ch of str) {
    const c = ch.charCodeAt(0);
    out += (c >= 0xAC00 && c <= 0xD7A3) ? CHO[Math.floor((c - 0xAC00) / 588)] : ch;
  }
  return out;
}
// 띄어쓴 단어가 전부 포함되면 일치. 초성(ㅈㄱ → 장갑)도 허용
function matches(query, ...texts) {
  const tokens = query.split(/\s+/).filter(Boolean).map(norm);
  if (!tokens.length) return true;
  const hay = norm(texts.join(' '));
  const hayCho = chosung(hay);
  return tokens.every(t => hay.includes(t) || (/^[ㄱ-ㅎ]+$/.test(t) && hayCho.includes(t)));
}
function filterCategories(query) {
  if (!query.trim()) return categories;
  const out = [];
  categories.forEach(cat => {
    const types = [];
    cat.types.forEach(type => {
      const sizes = type.sizes.filter(z => matches(query, cat.name, type.name, z.size));
      if (sizes.length) types.push({ name: type.name, sizes, total: type.sizes.length });
    });
    if (types.length) out.push({ name: cat.name, types });
  });
  return out;
}
let searchTimer = null;
$('search').addEventListener('input', () => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(renderCategories, 150);
});

function renderCategories() {
  const list = $('catList');
  const query = $('search').value;
  const searching = !!query.trim();
  const shown = filterCategories(query);
  list.innerHTML = '';
  if (!categories.length) { list.appendChild(el('div', 'empty', '신청 가능한 품목이 없습니다.')); return; }
  if (!shown.length) { list.appendChild(el('div', 'empty', `'${query.trim()}' 검색 결과가 없습니다.`)); return; }

  shown.forEach(cat => {
    const box = el('div', 'cat');
    const head = el('div', 'cat-head');
    const toggle = el('button', 'cat-toggle');
    toggle.appendChild(el('span', '', cat.name));
    const badge = el('span', 'badge hidden', '0');
    badge.dataset.badge = cat.name;
    toggle.appendChild(badge);
    toggle.appendChild(el('span', 'arrow', '›'));
    head.appendChild(toggle);
    box.appendChild(head);

    let body = null;
    if (searching) {                      // 검색 중에는 결과를 모두 펼쳐서 보여줌
      body = buildBody(cat, true);
      box.classList.add('open');
      box.appendChild(body);
    }
    toggle.addEventListener('click', () => {
      const open = box.classList.toggle('open');
      if (open && !body) { body = buildBody(cat, false); box.appendChild(body); }
      if (body) body.classList.toggle('hidden', !open);
    });
    list.appendChild(box);
  });
  refreshPhotoButtons();
  updateBadges();
}

function makeRow(cat, type, s, single) {
  const key = keyOf(cat.name, type.name, s.size);
  const row = el('div', 'row' + (single ? ' single' : '') + (s.stock > 0 ? '' : ' out') + (cart[key] ? ' sel' : ''));
  row.appendChild(el('div', 'size', single ? type.name : s.size));

  const getList = () => single ? singlePhotos(cat.name, type.name, s.size) : sizePhotos(cat.name, type.name, s.size);
  const pb = el('button', 'row-photo hidden'); pb.innerHTML = CAM;
  pb.dataset.cat = cat.name; pb.dataset.type = type.name; pb.dataset.size = s.size;
  if (single) pb.dataset.single = '1';
  pb.setAttribute('aria-label', '사진 보기');
  pb.addEventListener('click', () => openPhotoList((single ? type.name : s.size) + ' 사진', getList(), cat.name));
  if (getList().length) pb.classList.remove('hidden');
  row.appendChild(pb);
  row.appendChild(el('span', 'stock' + (s.stock > 0 ? '' : ' none'), s.stock > 0 ? `재고 ${s.stock}` : '구매요청'));

  const q = el('div', 'qty');
  const minus = el('button', '', '−');
  const input = el('input');
  input.type = 'number'; input.min = '0'; input.max = '9999'; input.inputMode = 'numeric';
  input.value = cart[key] ? cart[key].qty : 0;
  input.dataset.key = key;
  if (cart[key]) input.classList.add('on');
  const plus = el('button', '', '+');
  const meta = { category: cat.name, type: type.name, size: s.size };
  minus.addEventListener('click', () => setQty(key, meta, (parseInt(input.value) || 0) - 1));
  plus.addEventListener('click', () => setQty(key, meta, (parseInt(input.value) || 0) + 1));
  input.addEventListener('change', () => setQty(key, meta, parseInt(input.value) || 0));
  q.append(minus, input, plus);
  row.appendChild(q);
  return row;
}

function buildBody(cat, autoOpen) {
  const body = el('div', 'cat-body');
  cat.types.forEach(type => {
    const tbox = el('div', 'type-box');

    // 소분류가 원래 1개뿐인 중분류는 펼치지 않고 한 줄로 바로 보여줌
    if (INLINE_SINGLE && (type.total || type.sizes.length) === 1) {
      tbox.appendChild(makeRow(cat, type, type.sizes[0], true));
      body.appendChild(tbox);
      return;
    }

    const tt = el('button', 'type-toggle');
    tt.appendChild(el('span', '', type.name));
    const tp = el('span', 'type-photo hidden'); tp.innerHTML = CAM;
    tp.dataset.cat = cat.name; tp.dataset.type = type.name;
    tp.setAttribute('role', 'button'); tp.setAttribute('aria-label', '사진 보기');
    tp.addEventListener('click', e => { e.stopPropagation(); openPhotoList(type.name + ' 사진', typePhotos(cat.name, type.name), cat.name); });
    if (typePhotos(cat.name, type.name).length) tp.classList.remove('hidden');
    tt.appendChild(tp);
    const tb = el('span', 'badge hidden', '0');
    tb.dataset.tbadge = cat.name + '||' + type.name;
    tt.appendChild(tb);
    tt.appendChild(el('span', 'cnt', `${type.total || type.sizes.length}종`));
    tt.appendChild(el('span', 'arrow', '›'));
    tbox.appendChild(tt);

    const tbody = el('div', 'type-body hidden');
    type.sizes.forEach(s => tbody.appendChild(makeRow(cat, type, s, false)));
    tbox.appendChild(tbody);
    if (autoOpen) { tbox.classList.add('open'); tbody.classList.remove('hidden'); }
    tt.addEventListener('click', () => {
      const open = tbox.classList.toggle('open');
      tbody.classList.toggle('hidden', !open);
    });
    body.appendChild(tbox);
  });
  body.appendChild(el('p', 'hint', '재고가 없거나 모자란 수량은 구매 요청으로 자동 접수됩니다.'));
  updateBadges();
  return body;
}

let toastTimer = null;
function toast(msg) {
  const t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1500);
}

function setQty(key, meta, qty) {
  qty = Math.max(0, Math.min(9999, qty));
  const prev = cart[key] ? cart[key].qty : 0;
  if (qty === 0) delete cart[key]; else cart[key] = { ...meta, qty };
  document.querySelectorAll('input[data-key]').forEach(i => {
    if (i.dataset.key === key) { i.value = qty; i.classList.toggle('on', qty > 0); i.closest('.row').classList.toggle('sel', qty > 0); }
  });
  updateBadges();
  if (qty !== prev) {
    const label = `${meta.type} ${meta.size}`;
    toast(qty === 0 ? `${label} 뺐어요` : qty > prev ? `${label} ${qty}개 담았어요` : `${label} ${qty}개로 줄였어요`);
  }
  if (!$('cartModal').classList.contains('hidden')) renderCart();
}

function updateBadges() {
  const items = Object.values(cart);
  const perCat = {}, perType = {};
  let total = 0;
  items.forEach(i => {
    perCat[i.category] = (perCat[i.category] || 0) + 1;
    const tk = i.category + '||' + i.type;
    perType[tk] = (perType[tk] || 0) + 1;
    total += i.qty;
  });
  document.querySelectorAll('[data-badge]').forEach(b => {
    const n = perCat[b.dataset.badge] || 0;
    b.textContent = n; b.classList.toggle('hidden', n === 0);
  });
  document.querySelectorAll('[data-tbadge]').forEach(b => {
    const n = perType[b.dataset.tbadge] || 0;
    b.textContent = n; b.classList.toggle('hidden', n === 0);
  });
  const btn = $('openCart');
  btn.disabled = items.length === 0;
  btn.textContent = '';
  if (items.length) {
    btn.appendChild(document.createTextNode(`장바구니 보기 (${items.length}종 · 총 ${total}개)`));
    btn.appendChild(el('span', 'sub', items.map(i => `${i.type} ${i.size} ${i.qty}`).join(', ')));
  } else {
    btn.textContent = '품목을 담아주세요';
  }
  $('cartBar').classList.toggle('hidden', !user);
}

/* ───────── 사진 ───────── */
// 비교용 정규화: 한글 조합 방식(NFC/NFD), 공백, 전각 괄호 차이를 무시
function norm(s) {
  return String(s || '').normalize('NFC').replace(/[\s\u00a0]+/g, '').replace(/（/g, '(').replace(/）/g, ')').toLowerCase();
}
const same = (a, b) => norm(a) === norm(b);

function photosFor(cat) {
  const nc = norm(cat);
  let out = [];
  Object.keys(photos).forEach(k => {
    const nk = norm(k);
    if (nk && (nk === nc || nc.includes(nk) || nk.includes(nc))) out = out.concat(photos[k]);
  });
  return out;
}
// 소분류(사이즈) 단위 사진: 파일명 조각 중 소분류 이름이 있는 것
function sizePhotos(cat, type, size) {
  const c = categories.find(x => x.name === cat);
  const typeNames = c ? c.types.map(t => t.name) : [];
  return photosFor(cat).filter(p => {
    const rest = (p.parts || []).slice(1);
    if (!rest.some(x => same(x, size))) return false;
    // 다른 중분류 이름이 같이 있으면 그 중분류 사진이므로 제외
    return !rest.some(x => typeNames.some(n => same(n, x)) && !same(x, type));
  });
}
// 중분류 단위 사진: 파일명에 중분류 이름만 있고 소분류(사이즈) 이름은 없는 것
function typePhotos(cat, type) {
  const c = categories.find(x => x.name === cat);
  const t = c && c.types.find(x => x.name === type);
  const sizes = t ? t.sizes.map(z => z.size) : [];
  return photosFor(cat).filter(p => {
    const rest = (p.parts || []).slice(1);
    return rest.some(x => same(x, type)) && !rest.some(x => sizes.some(z => same(z, x)));
  });
}
// 소분류가 1개뿐인 줄: 중분류 이름 사진과 소분류 이름 사진을 모두 보여줌
function singlePhotos(cat, type, size) {
  const a = typePhotos(cat, type), b = sizePhotos(cat, type, size);
  return a.concat(b.filter(x => !a.includes(x)));
}
function refreshPhotoButtons() {
  document.querySelectorAll('.type-photo').forEach(b => {
    b.classList.toggle('hidden', typePhotos(b.dataset.cat, b.dataset.type).length === 0);
  });
  document.querySelectorAll('.row-photo').forEach(b => {
    const list = b.dataset.single ? singlePhotos(b.dataset.cat, b.dataset.type, b.dataset.size) : sizePhotos(b.dataset.cat, b.dataset.type, b.dataset.size);
    b.classList.toggle('hidden', list.length === 0);
  });
}
// 사진 순서 = 신청 화면의 중분류 순서 (시트 순서). 못 찾으면 맨 뒤
function typeRank(cat, type) {
  const c = categories.find(x => x.name === cat);
  if (!c) return 999;
  if (!type) return -1;
  const i = c.types.findIndex(t => same(t.name, type));
  return i < 0 ? 999 : i;
}
function openPhotos(cat) {
  const list = photosFor(cat).slice().sort((x, y) =>
    (typeRank(cat, x.type) - typeRank(cat, y.type)) || x.name.localeCompare(y.name, 'ko'));
  openPhotoList(cat + ' 사진', list, cat);
}
function openPhotoList(title, list, cat) {
  $('photoTitle').textContent = title;
  const box = $('photoContent');
  box.innerHTML = '';
  if (!list.length) box.appendChild(el('div', 'empty', '등록된 사진이 없습니다.'));
  list.forEach(p => {
    const item = el('div', 'photo-item');
    item.appendChild(el('div', 'cap', (p.parts || []).slice(1).join(' · ') || cat));
    const img = el('img');
    img.loading = 'lazy'; img.alt = p.name; img.src = p.url;
    item.appendChild(img);
    box.appendChild(item);
  });
  $('photoModal').classList.remove('hidden');
}
$('closePhoto').addEventListener('click', () => $('photoModal').classList.add('hidden'));

/* ───────── 장바구니 / 신청 ───────── */
function renderCart() {
  const box = $('cartList');
  box.innerHTML = '';
  const items = Object.entries(cart);
  if (!items.length) { box.appendChild(el('div', 'empty', '담은 항목이 없습니다.')); return; }
  items.forEach(([key, i]) => {
    const stock = stockIdx[key] || 0;
    const give = Math.min(i.qty, stock);
    const req = i.qty - give;
    const row = el('div', 'cart-row');
    const t = el('div', 't');
    t.appendChild(el('span', '', `${i.category} > ${i.type} > ${i.size} × ${i.qty}`));
    if (req > 0) t.appendChild(el('small', 'w', give > 0 ? `지급 ${give} / 구매요청 ${req}` : `재고 없음 → 구매요청 ${req}`));
    const del = el('button', 'del', '✕');
    del.setAttribute('aria-label', '삭제');
    del.addEventListener('click', () => setQty(key, i, 0));
    row.append(t, del);
    box.appendChild(row);
  });
}
$('openCart').addEventListener('click', () => { renderCart(); $('cartModal').classList.remove('hidden'); });
$('closeCart').addEventListener('click', () => $('cartModal').classList.add('hidden'));

async function submitOrder() {
  if (submitting) return;
  const items = Object.values(cart);
  if (!items.length) { $('cartModal').classList.add('hidden'); return; }

  submitting = true;
  $('submitBtn').disabled = true;
  showOverlay('신청 중입니다...');

  let serverReplied = false;
  try {
    const body = new URLSearchParams({
      mode: 'batch',
      name: `${user.empId} ${user.empName}`,
      remarks: $('remarks').value.trim(),
      items: JSON.stringify(items.map(i => ({ category: i.category, subcategory: i.type, size: i.size, quantity: i.qty })))
    });
    const res = await fetch(endpoint, { method: 'POST', headers: FORM, body });
    const data = await res.json();
    serverReplied = true;
    if (data.result !== 'success') throw new Error(data.message || '서버 오류');

    hideOverlay();
    alert(`${data.count || items.length}건 신청되었습니다.`);
    cart = {};
    $('remarks').value = '';
    $('cartModal').classList.add('hidden');
    itemsPromise = loadItems();                       // 재고 갱신
    try { await itemsPromise; } catch (e) {}
    renderCategories();
  } catch (e) {
    hideOverlay();
    if (serverReplied) {
      alert('신청 실패: ' + e.message + '\n\n신청되지 않았으니 확인 후 다시 시도해주세요.');
    } else {
      alert('신청이 접수됐는지 확인하지 못했습니다.\n(' + e.message + ')\n\n중복 신청을 막기 위해, 다시 누르기 전에 담당자에게 접수 여부를 확인해주세요.');
    }
  } finally {
    submitting = false;
    $('submitBtn').disabled = false;
    hideOverlay();
  }
}
$('submitBtn').addEventListener('click', submitOrder);
</script>
